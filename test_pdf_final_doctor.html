<!DOCTYPE html>
<html>
<head>
    <title>Test PDF Final - Consulta 203</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test PDF Final - Consulta 203</h1>
        
        <div class="section">
            <h2>Test Completo del Flujo PDF</h2>
            <p>Este test simulará exactamente el flujo del frontend para generar el PDF de la consulta 203.</p>
            <button onclick="testCompletePDFFlow()" id="testBtn">Generar PDF con Datos del Doctor</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        async function testCompletePDFFlow() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Iniciando test completo...</p>';
            
            try {
                // Paso 1: Obtener datos de la consulta
                console.log('🚀 Obteniendo datos de la consulta...');
                const response = await fetch('modules/consultas/api/livewire-system.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'get',
                        table: 'consultas',
                        id: 203,
                        id_consulta: 203
                    })
                });
                
                const apiData = await response.json();
                console.log('📨 Respuesta API:', apiData);
                
                if (!apiData.success) {
                    throw new Error('Error en API: ' + apiData.message);
                }
                
                const data = apiData.data;
                
                // Paso 2: Extraer datos del doctor como lo hace el frontend
                const doctor = {
                    nombre: `${data.doctor_first_name || ''} ${data.doctor_last_name || ''}`.trim() || 'No especificado',
                    email: data.doctor_email || 'No especificado',
                    documento: data.doctor_document || 'N/A'
                };
                
                console.log('👨‍⚕️ Datos del doctor extraídos:', doctor);
                
                // Paso 3: Crear contenido HTML como lo hace createPDFContent
                const paciente = {
                    nombre: `${data.first_name || ''} ${data.last_name || ''}`.trim(),
                    documento: data.document_number || 'N/A',
                    telefono: data.phone_number || data.whatsapptxt || 'N/A',
                    email: data.email || 'N/A'
                };
                
                const fechaConsulta = data.fecha_registro ? 
                    new Date(data.fecha_registro).toLocaleDateString('es-ES', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    }) : 'N/A';
                
                let html = `
                    <div class="header-section">
                        <h1>CONSULTA MÉDICA</h1>
                        <h2>ID: ${data.id_consulta}</h2>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-row">
                            <div class="info-cell">
                                <span class="field-label">Nombre:</span> 
                                <span class="field-value">${paciente.nombre}</span>
                            </div>
                            <div class="info-cell">
                                <span class="field-label">Documento:</span> 
                                <span class="field-value">${paciente.documento}</span>
                            </div>
                            <div class="clearfix"></div>
                        </div>
                        <div class="info-row">
                            <div class="info-cell">
                                <span class="field-label">Fecha de Consulta:</span> 
                                <span class="field-value">${fechaConsulta}</span>
                            </div>
                            <div class="info-cell">
                                <span class="field-label">Tipo:</span> 
                                <span class="field-value">${data.tipo_formulario || 'general'}</span>
                            </div>
                            <div class="clearfix"></div>
                        </div>
                        <div class="info-row">
                            <div class="info-cell">
                                <span class="field-label">Teléfono:</span> 
                                <span class="field-value">${paciente.telefono}</span>
                            </div>
                            <div class="info-cell">
                                <span class="field-label">Email:</span> 
                                <span class="field-value">${paciente.email}</span>
                            </div>
                            <div class="clearfix"></div>
                        </div>
                    </div>
                    
                    <div class="doctor-info">
                        <div class="doctor-name">Dr. ${doctor.nombre}</div>
                        <div class="doctor-details">Email: ${doctor.email} | Documento: ${doctor.documento}</div>
                    </div>`;
                
                if (data.txtmotivo) {
                    html += `
                        <div class="section-header">CONSULTA GENERAL</div>
                        <div class="content-section">
                            <strong>Motivo:</strong><br>
                            <div>${data.txtmotivo}</div>
                        </div>`;
                }
                
                console.log('📄 HTML generado (primeros 200 chars):', html.substring(0, 200) + '...');
                
                // Paso 4: Enviar a generate_pdf.php
                console.log('📤 Enviando a generate_pdf.php...');
                const pdfResponse = await fetch('modules/consultas/api/generate_pdf.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        consulta_id: 203,
                        html_content: html,
                        consulta_data: data
                    })
                });
                
                if (pdfResponse.ok) {
                    // Paso 5: Descargar PDF
                    console.log('✅ PDF generado exitosamente');
                    const blob = await pdfResponse.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    
                    const fecha = data.fecha_consulta || data.fecha_registro?.split(' ')[0] || new Date().toISOString().split('T')[0];
                    const pacienteNombre = `${data.first_name || ''}_${data.last_name || ''}`.replace(/\s+/g, '_');
                    a.download = `consulta_203_${pacienteNombre}_${fecha}_CON_DOCTOR.pdf`;
                    
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>🎉 ¡PDF Generado Exitosamente!</h3>
                            <p><strong>Doctor encontrado:</strong> Dr. ${doctor.nombre}</p>
                            <p><strong>Email:</strong> ${doctor.email}</p>
                            <p><strong>Documento:</strong> ${doctor.documento}</p>
                            <p><strong>Archivo descargado:</strong> consulta_203_${pacienteNombre}_${fecha}_CON_DOCTOR.pdf</p>
                        </div>
                    `;
                } else {
                    const errorText = await pdfResponse.text();
                    throw new Error('Error al generar PDF: ' + errorText);
                }
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
