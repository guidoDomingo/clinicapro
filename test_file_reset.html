<!DOCTYPE html>
<html>
<head>
    <title>Test File Reset Behavior</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Test: Archivo Reset después de Consulta</h2>
        
        <div class="row">
            <div class="col-md-6">
                <h4>🔧 Simulación de Consulta Creada Exitosamente</h4>
                <div class="card">
                    <div class="card-body">
                        <h6>Archivos Adjuntos</h6>
                        <input type="file" 
                               id="archivos_consulta" 
                               name="archivos[]" 
                               multiple 
                               accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.rtf,.jpg,.jpeg,.png,.gif,.bmp,.tiff,.webp,.svg"
                               onchange="previewArchivos(this)" 
                               class="form-control mb-3">
                        
                        <div id="archivos-preview" class="mt-3"></div>
                        
                        <button onclick="simulateSuccessfulCreate()" class="btn btn-success mt-3">
                            ✅ Simular Consulta Creada Exitosamente
                        </button>
                        
                        <button onclick="clearSelectedFiles()" class="btn btn-warning mt-2">
                            🧹 Limpiar Archivos Manualmente
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <h4>📊 Estado del Sistema</h4>
                <div class="card">
                    <div class="card-body">
                        <div id="status-info">
                            <p><strong>Archivos seleccionados:</strong> <span id="file-count">0</span></p>
                            <p><strong>Input value:</strong> <span id="input-value">vacío</span></p>
                            <p><strong>Preview content:</strong> <span id="preview-status">vacío</span></p>
                        </div>
                        
                        <div class="mt-3">
                            <h6>📋 Log de Eventos:</h6>
                            <div id="event-log" class="border p-2" style="height: 200px; overflow-y: auto; font-size: 0.8em;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Log de eventos
        function logEvent(message) {
            const now = new Date().toLocaleTimeString();
            const log = document.getElementById('event-log');
            log.innerHTML += `<div>[${now}] ${message}</div>`;
            log.scrollTop = log.scrollHeight;
            console.log(message);
        }

        // Formatear tamaño de archivo
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Obtener icono de archivo
        function getFileIcon(mimeType, fileName = '') {
            logEvent(`🔍 Detectando tipo de archivo - MIME: ${mimeType}, Nombre: ${fileName}`);
            
            // Detección por MIME type (método principal)
            if (mimeType) {
                if (mimeType.includes('pdf')) return 'fas fa-file-pdf text-danger';
                if (mimeType.includes('word') || mimeType.includes('msword') || mimeType.includes('wordprocessingml')) return 'fas fa-file-word text-primary';
                if (mimeType.includes('sheet') || mimeType.includes('excel') || mimeType.includes('spreadsheetml')) return 'fas fa-file-excel text-success';
                if (mimeType.includes('presentation') || mimeType.includes('powerpoint') || mimeType.includes('presentationml')) return 'fas fa-file-powerpoint text-warning';
                if (mimeType.includes('text/plain') || mimeType.includes('text/rtf')) return 'fas fa-file-alt text-secondary';
                if (mimeType.includes('image/')) return 'fas fa-file-image text-info';
            }
            
            // Detección por extensión como respaldo
            if (fileName) {
                const extension = fileName.toLowerCase().split('.').pop();
                switch (extension) {
                    case 'pdf': return 'fas fa-file-pdf text-danger';
                    case 'doc':
                    case 'docx': return 'fas fa-file-word text-primary';
                    case 'xls':
                    case 'xlsx': return 'fas fa-file-excel text-success';
                    case 'ppt':
                    case 'pptx': return 'fas fa-file-powerpoint text-warning';
                    case 'txt':
                    case 'rtf': return 'fas fa-file-alt text-secondary';
                    case 'jpg':
                    case 'jpeg':
                    case 'png':
                    case 'gif':
                    case 'bmp':
                    case 'tiff':
                    case 'webp':
                    case 'svg': return 'fas fa-file-image text-info';
                }
            }
            
            // Icono por defecto
            return 'fas fa-file text-muted';
        }

        // Preview de archivos
        function previewArchivos(input) {
            const preview = document.getElementById('archivos-preview');
            preview.innerHTML = '';
            
            logEvent(`📁 previewArchivos() - ${input.files.length} archivos seleccionados`);
            
            if (input.files && input.files.length > 0) {
                const container = document.createElement('div');
                container.className = 'archivos-selected';
                
                Array.from(input.files).forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item d-flex align-items-center mb-2 p-2 border rounded';
                    
                    const icon = getFileIcon(file.type, file.name);
                    const size = formatFileSize(file.size);
                    
                    fileItem.innerHTML = `
                        <i class="${icon} me-2"></i>
                        <span class="file-name me-auto">${file.name}</span>
                        <span class="file-size text-muted me-2">${size}</span>
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeFile(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    `;
                    
                    container.appendChild(fileItem);
                    logEvent(`  ✅ Archivo ${index + 1}: ${file.name} (${size})`);
                });
                
                preview.appendChild(container);
                logEvent(`📁 Preview actualizado con ${input.files.length} archivos`);
            }
            
            updateStatus();
        }

        // Limpiar archivos seleccionados
        function clearSelectedFiles() {
            logEvent('🧹 clearSelectedFiles() - Iniciando limpieza...');
            
            // Limpiar formulario de creación
            const archivosInput = document.getElementById('archivos_consulta');
            const archivosPreview = document.getElementById('archivos-preview');
            
            if (archivosInput) {
                archivosInput.value = '';
                logEvent('  ✅ Input de archivos limpiado');
            }
            
            if (archivosPreview) {
                archivosPreview.innerHTML = '';
                logEvent('  ✅ Preview de archivos limpiado');
            }
            
            logEvent('🧹 Limpieza completada');
            updateStatus();
        }

        // Simular creación exitosa de consulta
        function simulateSuccessfulCreate() {
            const input = document.getElementById('archivos_consulta');
            if (input.files && input.files.length > 0) {
                logEvent(`🎉 SIMULACIÓN: Consulta creada exitosamente con ${input.files.length} archivos`);
                logEvent('🔄 Ejecutando resetForm() simulado...');
                
                // Simular el comportamiento de resetForm()
                setTimeout(() => {
                    clearSelectedFiles();
                    logEvent('✅ Reset completado - archivos limpiados para nueva consulta');
                }, 500);
            } else {
                logEvent('⚠️ No hay archivos seleccionados para probar');
            }
        }

        // Actualizar estado del sistema
        function updateStatus() {
            const input = document.getElementById('archivos_consulta');
            const preview = document.getElementById('archivos-preview');
            
            document.getElementById('file-count').textContent = input.files ? input.files.length : 0;
            document.getElementById('input-value').textContent = input.value || 'vacío';
            document.getElementById('preview-status').textContent = preview.innerHTML ? 'con contenido' : 'vacío';
        }

        // Eliminar archivo individual
        function removeFile(index) {
            logEvent(`❌ removeFile(${index}) - Esta función requiere implementación completa`);
            // Nota: Esta función requiere lógica adicional para eliminar archivos individuales del FileList
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            logEvent('🚀 Sistema de prueba inicializado');
            updateStatus();
            
            // Monitorear cambios en el input
            document.getElementById('archivos_consulta').addEventListener('change', updateStatus);
        });
    </script>

    <!-- Font Awesome para iconos -->
    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js" crossorigin="anonymous"></script>
    <!-- Si no tienes kit, usar CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</body>
</html>
