<!DOCTYPE html>
<html>
<head>
    <title>Test AJAX Directo</title>
    <script src="view/plugins/jquery/jquery.min.js"></script>
</head>
<body>
    <h2>Test AJAX Directo - Turnos</h2>
    
    <button onclick="testAjax()">Probar AJAX</button>
    <button onclick="testAjaxConForm()">Probar AJAX con FormData</button>
    
    <div id="resultado"></div>

    <script>
        function testAjax() {
            console.log("Probando AJAX...");
            
            $.ajax({
                url: 'ajax/turnos.ajax.php',
                type: 'POST',
                data: {
                    "accion": "obtenerTurnos"
                },
                dataType: 'json',
                success: function(respuesta) {
                    console.log("AJAX Success:", respuesta);
                    
                    let html = "<h3>Respuesta exitosa:</h3>";
                    html += "<p>Tipo: " + typeof respuesta + "</p>";
                    
                    if(Array.isArray(respuesta)) {
                        html += "<p>Es array con " + respuesta.length + " elementos</p>";
                        if(respuesta.length > 0) {
                            html += "<h4>Datos:</h4><ul>";
                            respuesta.forEach(function(item, index) {
                                html += "<li><strong>" + item.turno_nombre + "</strong> - " + (item.turno_descripcion || 'Sin descripción') + "</li>";
                            });
                            html += "</ul>";
                        }
                    } else {
                        html += "<p>No es array: " + JSON.stringify(respuesta) + "</p>";
                    }
                    
                    $('#resultado').html(html);
                },
                error: function(xhr, status, error) {
                    console.error("AJAX Error:", error);
                    console.error("Status:", xhr.status);
                    console.error("Response:", xhr.responseText);
                    
                    let html = "<h3 style='color: red;'>Error AJAX:</h3>";
                    html += "<p>Status: " + xhr.status + "</p>";
                    html += "<p>Error: " + error + "</p>";
                    html += "<p>Response: <pre>" + xhr.responseText + "</pre></p>";
                    
                    $('#resultado').html(html);
                }
            });
        }
        
        function testAjaxConForm() {
            console.log("Probando AJAX con FormData...");
            
            let formData = new FormData();
            formData.append('accion', 'obtenerTurnos');
            
            $.ajax({
                url: 'ajax/turnos.ajax.php',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                dataType: 'json',
                success: function(respuesta) {
                    console.log("AJAX FormData Success:", respuesta);
                    
                    let html = "<h3>Respuesta con FormData:</h3>";
                    html += "<p>Tipo: " + typeof respuesta + "</p>";
                    html += "<p>Contenido: " + JSON.stringify(respuesta) + "</p>";
                    
                    $('#resultado').html(html);
                },
                error: function(xhr, status, error) {
                    console.error("AJAX FormData Error:", error);
                    
                    let html = "<h3 style='color: red;'>Error AJAX FormData:</h3>";
                    html += "<p>Status: " + xhr.status + "</p>";
                    html += "<p>Error: " + error + "</p>";
                    html += "<p>Response: <pre>" + xhr.responseText + "</pre></p>";
                    
                    $('#resultado').html(html);
                }
            });
        }
    </script>
</body>
</html>
