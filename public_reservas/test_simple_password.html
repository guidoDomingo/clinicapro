<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple Cambio de Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container mt-5">
        <h1>Test Simple - Cambio de Contraseña</h1>
        
        <div class="card">
            <div class="card-body">
                <form id="simplePasswordForm">
                    <div class="mb-3">
                        <label for="current_password" class="form-label">Contraseña Actual</label>
                        <input type="password" class="form-control" id="current_password" name="current_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">Nueva Contraseña</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" minlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirmar Nueva Contraseña</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Cambiar Contraseña</button>
                </form>
                
                <div class="mt-3">
                    <h5>Debug Console:</h5>
                    <div id="debugConsole" style="background: #f8f9fa; padding: 10px; border: 1px solid #ddd; height: 200px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Función para escribir en el debug console
        function debugLog(message) {
            const console = document.getElementById('debugConsole');
            const timestamp = new Date().toLocaleTimeString();
            console.innerHTML += `[${timestamp}] ${message}<br>`;
            console.scrollTop = console.scrollHeight;
            
            // También escribir en la consola del navegador
            console.log(`[${timestamp}] ${message}`);
        }
        
        $(document).ready(function() {
            debugLog('Documento listo - Inicializando formulario');
            
            $('#simplePasswordForm').on('submit', function(e) {
                e.preventDefault();
                debugLog('Formulario enviado - iniciando validaciones');
                
                const currentPassword = $('#current_password').val();
                const newPassword = $('#new_password').val();
                const confirmPassword = $('#confirm_password').val();
                
                debugLog(`Datos recogidos: current="${currentPassword}", new="${newPassword}", confirm="${confirmPassword}"`);
                
                // Validaciones básicas
                if (!currentPassword || !newPassword || !confirmPassword) {
                    debugLog('ERROR: Campos vacíos detectados');
                    Swal.fire('Error', 'Todos los campos son obligatorios', 'error');
                    return;
                }
                
                if (newPassword !== confirmPassword) {
                    debugLog('ERROR: Las contraseñas nuevas no coinciden');
                    Swal.fire('Error', 'Las contraseñas nuevas no coinciden', 'error');
                    return;
                }
                
                if (newPassword.length < 6) {
                    debugLog('ERROR: Contraseña muy corta');
                    Swal.fire('Error', 'La nueva contraseña debe tener al menos 6 caracteres', 'error');
                    return;
                }
                
                debugLog('Validaciones completadas - preparando envío AJAX');
                
                // Preparar datos
                const formData = new FormData();
                formData.append('action', 'changePassword');
                formData.append('current_password', currentPassword);
                formData.append('new_password', newPassword);
                
                const url = '../controller/profile.controller.php';
                debugLog(`URL destino: ${url}`);
                
                // Mostrar indicador de carga
                Swal.fire({
                    title: 'Cambiando contraseña...',
                    text: 'Por favor espera',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });
                
                debugLog('Enviando petición AJAX...');
                
                $.ajax({
                    url: url,
                    method: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    beforeSend: function() {
                        debugLog('beforeSend: Petición iniciada');
                    },
                    success: function(response) {
                        debugLog(`SUCCESS: Respuesta recibida - ${JSON.stringify(response)}`);
                        
                        try {
                            let data;
                            if (typeof response === 'string') {
                                debugLog('Parseando respuesta JSON...');
                                data = JSON.parse(response);
                            } else {
                                data = response;
                            }
                            
                            debugLog(`Datos parseados: ${JSON.stringify(data)}`);
                            
                            if (data.status === 'success') {
                                debugLog('Éxito: Mostrando SweetAlert de éxito');
                                Swal.fire({
                                    icon: 'success',
                                    title: '¡Éxito!',
                                    text: data.message,
                                    confirmButtonText: 'Continuar'
                                }).then(() => {
                                    debugLog('Usuario confirmó - recargando página');
                                    window.location.reload();
                                });
                            } else {
                                debugLog(`Error del servidor: ${data.message}`);
                                Swal.fire({
                                    icon: 'error',
                                    title: 'Error',
                                    text: data.message || 'Error al cambiar la contraseña',
                                    confirmButtonText: 'Entendido'
                                });
                            }
                        } catch (e) {
                            debugLog(`ERROR parseando JSON: ${e.message}`);
                            debugLog(`Respuesta raw: ${response}`);
                            
                            Swal.fire({
                                icon: 'error',
                                title: 'Error de procesamiento',
                                text: 'Error al procesar la respuesta del servidor',
                                confirmButtonText: 'Entendido'
                            });
                        }
                    },
                    error: function(xhr, status, error) {
                        debugLog(`ERROR AJAX: status=${status}, error=${error}`);
                        debugLog(`XHR responseText: ${xhr.responseText}`);
                        
                        Swal.fire({
                            icon: 'error',
                            title: 'Error de conexión',
                            text: `Error al comunicarse con el servidor: ${error}`,
                            confirmButtonText: 'Entendido'
                        });
                    },
                    complete: function() {
                        debugLog('COMPLETE: Petición finalizada');
                    }
                });
            });
        });
    </script>
</body>
</html>
