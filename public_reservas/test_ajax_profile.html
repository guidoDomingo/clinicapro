<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AJAX Profile Update</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container mt-5">
        <h1>Test AJAX Profile Update</h1>
        
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3>Actualizar Perfil - Test AJAX</h3>
                    </div>
                    <div class="card-body">
                        <form id="testForm">
                            <div class="mb-3">
                                <label for="first_name" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="first_name" name="first_name" value="celso" required>
                            </div>
                            <div class="mb-3">
                                <label for="last_name" class="form-label">Apellido</label>
                                <input type="text" class="form-control" id="last_name" name="last_name" value="venegas" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" value="celso@celso.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="document" class="form-label">Documento</label>
                                <input type="text" class="form-control" id="document" name="document" value="5004617" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Teléfono</label>
                                <input type="text" class="form-control" id="phone" name="phone" value="0982313358" required>
                            </div>
                            <div class="mb-3">
                                <label for="address" class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="address" name="address" value="madrid">
                            </div>
                            <div class="mb-3">
                                <label for="birth_date" class="form-label">Fecha de nacimiento</label>
                                <input type="date" class="form-control" id="birth_date" name="birth_date" value="1995-08-04">
                            </div>
                            <div class="mb-3">
                                <label for="gender" class="form-label">Género</label>
                                <select class="form-control" id="gender" name="gender">
                                    <option value="M" selected>Masculino</option>
                                    <option value="F">Femenino</option>
                                    <option value="O">Otro</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">Test Update Profile</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Debug Info</h5>
                    </div>
                    <div class="card-body">
                        <div id="debugInfo">
                            <p><strong>URL:</strong> <span id="debugUrl"></span></p>
                            <p><strong>Request:</strong> <span id="debugRequest"></span></p>
                            <p><strong>Response:</strong> <span id="debugResponse"></span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('#testForm').on('submit', function(e) {
                e.preventDefault();
                
                // Recopilar los datos del formulario
                const formData = new FormData();
                formData.append('action', 'updateProfile');
                formData.append('first_name', $('#first_name').val());
                formData.append('last_name', $('#last_name').val());
                formData.append('email', $('#email').val());
                formData.append('document', $('#document').val());
                formData.append('phone', $('#phone').val());
                formData.append('address', $('#address').val());
                formData.append('birth_date', $('#birth_date').val());
                formData.append('gender', $('#gender').val());
                
                const url = '../controller/profile.controller.php';
                $('#debugUrl').text(url);
                $('#debugRequest').text('Enviando...');
                $('#debugResponse').text('Esperando...');
                
                // Mostrar indicador de carga
                Swal.fire({
                    title: 'Enviando...',
                    text: 'Probando actualización de perfil',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });
                
                // Enviar los datos mediante AJAX
                $.ajax({
                    url: url,
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        console.log('Raw response:', response);
                        $('#debugRequest').text('SUCCESS');
                        $('#debugResponse').text(JSON.stringify(response, null, 2));
                        
                        try {
                            const data = JSON.parse(response);
                            
                            if (data.status === 'success') {
                                Swal.fire({
                                    icon: 'success',
                                    title: '¡Perfil actualizado!',
                                    text: data.message,
                                    showConfirmButton: true
                                });
                            } else {
                                Swal.fire({
                                    icon: 'error',
                                    title: 'Error',
                                    text: data.message || 'Error al actualizar el perfil',
                                    showConfirmButton: true
                                });
                            }
                        } catch (e) {
                            console.error('Error al procesar la respuesta:', e);
                            console.log('Response content:', response);
                            
                            Swal.fire({
                                icon: 'error',
                                title: 'Error de parseo',
                                text: 'Error al procesar la respuesta: ' + e.message,
                                showConfirmButton: true
                            });
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error('Error en la solicitud AJAX:', error);
                        console.log('XHR:', xhr);
                        
                        $('#debugRequest').text('ERROR');
                        $('#debugResponse').text('Status: ' + status + ', Error: ' + error + ', Response: ' + xhr.responseText);
                        
                        Swal.fire({
                            icon: 'error',
                            title: 'Error de comunicación',
                            text: 'Error al comunicarse con el servidor: ' + error,
                            showConfirmButton: true
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
