<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Cambio de Contraseña</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Prueba de Cambio de Contraseña</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <p>Esta página es una prueba para diagnosticar el problema con el cambio de contraseña.</p>
                            <p>Los datos se enviarán al endpoint correcto y se registrarán para su análisis.</p>
                        </div>

                        <form id="testPasswordForm" class="mt-4">
                            <div class="mb-3">
                                <label for="current_password" class="form-label">Contraseña Actual</label>
                                <input type="password" class="form-control" id="current_password" name="current_password">
                            </div>
                            <div class="mb-3">
                                <label for="new_password" class="form-label">Nueva Contraseña</label>
                                <input type="password" class="form-control" id="new_password" name="new_password">
                            </div>
                            <div class="mb-3">
                                <label for="confirm_password" class="form-label">Confirmar Nueva Contraseña</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password">
                            </div>
                            
                            <div class="mb-3">
                                <label for="endpoint" class="form-label">Endpoint a utilizar</label>
                                <select class="form-control" id="endpoint">
                                    <option value="../controller/profile.controller.php">Controller Principal (../controller/profile.controller.php)</option>
                                    <option value="diagnostico_cambio_password.php">Script de Diagnóstico (diagnostico_cambio_password.php)</option>
                                </select>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Cambiar Contraseña</button>
                        </form>
                        
                        <div class="mt-4">
                            <h5>Resultado</h5>
                            <div id="result" class="border p-3" style="min-height: 150px; max-height: 300px; overflow-y: auto;">
                                <code>Aquí se mostrará el resultado de la operación...</code>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>
    
    <script>
    $(document).ready(function() {
        $('#testPasswordForm').on('submit', function(e) {
            e.preventDefault();
            
            // Validar que las contraseñas coincidan
            const newPassword = $('#new_password').val();
            const confirmPassword = $('#confirm_password').val();
            
            if (newPassword !== confirmPassword) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Las contraseñas nuevas no coinciden'
                });
                return;
            }
            
            // Mostrar indicador de carga
            Swal.fire({
                title: 'Enviando solicitud...',
                text: 'Por favor espera',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });
            
            const endpoint = $('#endpoint').val();
            console.log('Enviando solicitud a:', endpoint);
            
            // Crear FormData para enviar
            const formData = new FormData();
            formData.append('action', 'changePassword');
            formData.append('current_password', $('#current_password').val());
            formData.append('new_password', $('#new_password').val());
            
            // Log de los datos que se envían
            console.log('Datos a enviar:', {
                action: 'changePassword',
                current_password: $('#current_password').val(),
                new_password: $('#new_password').val()
            });
            
            // Enviar la solicitud
            $.ajax({
                url: endpoint,
                method: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    console.log('Respuesta recibida:', response);
                    Swal.close();
                    
                    // Mostrar respuesta en el área de resultados
                    let formattedResponse;
                    if (typeof response === 'string') {
                        try {
                            // Intentar formatear como JSON si es una cadena
                            formattedResponse = JSON.stringify(JSON.parse(response), null, 2);
                        } catch(e) {
                            formattedResponse = response;
                        }
                    } else {
                        formattedResponse = JSON.stringify(response, null, 2);
                    }
                    
                    $('#result').html(`<pre>${formattedResponse}</pre>`);
                    
                    // Mostrar mensaje según el resultado
                    if (response.status === 'success') {
                        Swal.fire({
                            icon: 'success',
                            title: 'Éxito',
                            text: 'Contraseña cambiada correctamente'
                        });
                    } else if (response.status === 'error') {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: response.message || 'Error al cambiar la contraseña'
                        });
                    } else {
                        Swal.fire({
                            icon: 'info',
                            title: 'Información',
                            text: 'Se recibió la respuesta. Revisa el área de resultados.'
                        });
                    }
                },
                error: function(xhr, status, error) {
                    console.error('Error en la solicitud:', status, error);
                    Swal.close();
                    
                    $('#result').html(`<pre>Error: ${status}\n${xhr.responseText}</pre>`);
                    
                    Swal.fire({
                        icon: 'error',
                        title: 'Error de conexión',
                        text: 'No se pudo conectar con el servidor: ' + error
                    });
                }
            });
        });
    });
    </script>
</body>
</html>
