<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Doctores por Fecha</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .result { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        pre { background-color: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input[type="date"] { padding: 8px; margin: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🩺 Prueba de Doctores por Fecha</h1>
        
        <div style="margin: 20px 0;">
            <label for="fechaPrueba">Seleccione una fecha:</label>
            <input type="date" id="fechaPrueba" value="2025-07-17">
            <button onclick="probarDoctoresPorFecha()">Obtener Doctores</button>
            <button onclick="probarFechasVariadas()">Probar Varias Fechas</button>
        </div>
        
        <div id="resultados"></div>
    </div>

    <script>
        function mostrarResultado(tipo, titulo, contenido) {
            const div = document.createElement('div');
            div.className = `result ${tipo}`;
            div.innerHTML = `<h3>${titulo}</h3>${contenido}`;
            document.getElementById('resultados').appendChild(div);
        }

        function probarDoctoresPorFecha() {
            const fecha = document.getElementById('fechaPrueba').value;
            
            if (!fecha) {
                mostrarResultado('error', '❌ Error', 'Por favor seleccione una fecha');
                return;
            }

            mostrarResultado('info', '⏳ Probando...', `Obteniendo doctores para la fecha: ${fecha}`);

            $.ajax({
                url: 'ajax/servicios.ajax.php',
                method: 'POST',
                data: {
                    action: 'obtenerDoctoresPorFecha',
                    fecha: fecha
                },
                dataType: 'json',
                success: function(respuesta) {
                    console.log('Respuesta completa:', respuesta);
                    
                    if (respuesta.status === 'success') {
                        let contenido = `
                            <p><strong>Estado:</strong> ${respuesta.status}</p>
                            <p><strong>Total doctores:</strong> ${respuesta.total || respuesta.data.length}</p>
                        `;
                        
                        if (respuesta.data && respuesta.data.length > 0) {
                            contenido += '<h4>Doctores encontrados:</h4><pre>' + JSON.stringify(respuesta.data, null, 2) + '</pre>';
                        } else {
                            contenido += '<p>No se encontraron doctores para esta fecha.</p>';
                        }
                        
                        mostrarResultado('success', '✅ Éxito', contenido);
                    } else {
                        mostrarResultado('error', '❌ Error', `<p>${respuesta.message || 'Error desconocido'}</p>`);
                    }
                },
                error: function(xhr, status, error) {
                    console.error('Error AJAX:', xhr, status, error);
                    mostrarResultado('error', '❌ Error AJAX', `
                        <p><strong>Status:</strong> ${status}</p>
                        <p><strong>Error:</strong> ${error}</p>
                        <p><strong>Respuesta:</strong></p>
                        <pre>${xhr.responseText}</pre>
                    `);
                }
            });
        }

        function probarFechasVariadas() {
            const fechas = [
                '2025-07-17', // Jueves (hoy)
                '2025-07-18', // Viernes
                '2025-07-21', // Lunes
                '2025-07-22', // Martes
                '2025-07-23', // Miércoles
            ];

            document.getElementById('resultados').innerHTML = '<div class="result info"><h3>⏳ Probando múltiples fechas...</h3></div>';

            fechas.forEach((fecha, index) => {
                setTimeout(() => {
                    document.getElementById('fechaPrueba').value = fecha;
                    probarDoctoresPorFecha();
                }, index * 1000); // Esperar 1 segundo entre cada prueba
            });
        }

        // Probar automáticamente al cargar la página
        window.addEventListener('load', function() {
            setTimeout(probarDoctoresPorFecha, 500);
        });
    </script>
</body>
</html>
