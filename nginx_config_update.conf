
# Configuración para puerto 8888 únicamente
server {
    listen 8888;
    server_name 181.122.125.143;

    root /var/www/html/clinica;
    index index.php index.html index.htm;

    access_log /var/log/nginx/clinica_8888_access.log;
    error_log /var/log/nginx/clinica_8888_error.log;

    # Manejo específico para la API en puerto 8888
    location /api/ {
        try_files $uri $uri/ /api/index.php?route=$request_uri&$args;
        
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param QUERY_STRING route=$request_uri&$args;
            fastcgi_param SERVER_PORT 8888;
            include fastcgi_params;
        }
    }

    # Manejo específico para la carpeta AJAX
    location /ajax/ {
        try_files $uri $uri/ =404;
        
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SERVER_PORT 8888;
            include fastcgi_params;
        }
    }

    # Permitir acceso directo a la carpeta modules/mail/api
    location /modules/mail/api/ {
        try_files $uri $uri/ =404;
        
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SERVER_PORT 8888;
            include fastcgi_params;
        }
    }

    # Reescritura de rutas principal para puerto 8888
    location / {
        try_files $uri $uri/ @rewrite;
    }
    
    # Reescritura personalizada para el sistema de rutas
    location @rewrite {
        rewrite ^/([a-zA-Z0-9-]+)/?$ /index.php?ruta=$1 last;
        rewrite ^/(.*)$ /index.php?ruta=$1 last;
    }

    # Manejo específico de archivos PHP
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SERVER_PORT 8888;
        include fastcgi_params;
    }

    # Proteger archivos sensibles
    location ~ /\.(htaccess|htpasswd|git|env)$ {
        deny all;
    }
    
    location ~ /(config\.php|composer\.(json|lock))$ {
        deny all;
    }

    # Optimización de caché para archivos estáticos
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Deshabilitar listado de directorios
    autoindex off;
}