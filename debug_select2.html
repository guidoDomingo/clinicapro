<!DOCTYPE html>
<html>
<head>
    <title>Debug Select2 Modal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css">
</head>
<body>
    <div class="container mt-5">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#testModal">
            Abrir Modal de Test
        </button>

        <!-- Modal -->
        <div class="modal fade" id="testModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Test Select2</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Equipo Médico</label>
                            <select class="form-select select2bs4" id="test_equipo_medico">
                                <option value="">Seleccionar equipo médico...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correos</label>
                            <select class="form-control select2bs4" id="test_emails" multiple="multiple">
                                <!-- correos dinámicos -->
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button type="button" class="btn btn-primary" id="testLoad">Cargar Datos</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <script>
        $(document).ready(function() {
            console.log('🚀 Test iniciado');
            
            $('#testModal').on('shown.bs.modal', function() {
                console.log('📝 Modal abierto, inicializando Select2...');
                
                setTimeout(() => {
                    // Simular carga de equipos médicos
                    const equipoSelect = document.getElementById('test_equipo_medico');
                    const equipos = [
                        { valor: 'oct_triton', texto: 'OCT Triton' },
                        { valor: 'humphrey', texto: 'Humphrey' },
                        { valor: 'pentacam', texto: 'Pentacam' }
                    ];
                    
                    equipos.forEach(equipo => {
                        const option = document.createElement('option');
                        option.value = equipo.valor;
                        option.textContent = equipo.texto;
                        equipoSelect.appendChild(option);
                    });
                    
                    // Inicializar Select2 para equipos
                    $(equipoSelect).select2({
                        theme: 'bootstrap-5',
                        placeholder: 'Seleccionar equipo médico...',
                        allowClear: true,
                        width: '100%',
                        dropdownParent: $('#testModal')
                    });
                    
                    // Inicializar Select2 para correos
                    $('#test_emails').select2({
                        theme: 'bootstrap-5',
                        placeholder: 'Agregar correos...',
                        allowClear: true,
                        width: '100%',
                        tags: true,
                        dropdownParent: $('#testModal')
                    });
                    
                    console.log('✅ Select2 inicializado');
                }, 200);
            });
            
            $('#testModal').on('hidden.bs.modal', function() {
                console.log('🧹 Limpiando modal...');
                $('.select2bs4').each(function() {
                    if ($(this).hasClass('select2-hidden-accessible')) {
                        $(this).select2('destroy');
                    }
                });
            });
        });
    </script>
</body>
</html>
