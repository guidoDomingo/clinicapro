<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Búsqueda de Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Prueba de Búsqueda de Pacientes</h2>
    
    <div class="mb-3">
        <label for="search-input" class="form-label">Buscar paciente:</label>
        <input type="text" class="form-control" id="search-input" placeholder="Escriba nombre, documento...">
    </div>
    
    <div id="results" class="mt-3"></div>
    
    <div class="mt-4">
        <h4>Log:</h4>
        <div id="log" class="border p-3" style="height: 300px; overflow-y: auto; background-color: #f8f9fa;"></div>
    </div>
</div>

<script>
const API_BASE = 'modules/consultas/api/livewire-system.php';

function log(message) {
    const logEl = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    logEl.innerHTML += `[${time}] ${message}\n`;
    logEl.scrollTop = logEl.scrollHeight;
    console.log(message);
}

async function callAPI(action, data = {}) {
    const requestData = {
        action: action,
        ...data
    };
    
    log('API Request: ' + JSON.stringify(requestData));
    
    try {
        const response = await fetch(API_BASE, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(requestData)
        });
        
        log('Response status: ' + response.status);
        
        const result = await response.json();
        log('API Response: ' + JSON.stringify(result, null, 2));
        
        if (!result.success) {
            throw new Error(result.message || 'Error en la operación');
        }
        
        return result;
        
    } catch (error) {
        log('API Error: ' + error.message);
        throw error;
    }
}

let searchTimeout;
async function searchPatients(query) {
    log('searchPatients called with: ' + query);
    const resultsEl = document.getElementById('results');
    
    if (query.length < 2) {
        resultsEl.innerHTML = '<div class="text-muted">Escribe al menos 2 caracteres</div>';
        return;
    }
    
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(async () => {
        log('Making API call for search...');
        try {
            const result = await callAPI('search', {
                table: 'rh_person',
                search: query,
                limit: 10
            });
            
            log('Search completed. Results: ' + (result.data ? result.data.length : 0));
            
            if (result.data && result.data.length > 0) {
                const html = result.data.map(patient => {
                    return `
                        <div class="card mb-2">
                            <div class="card-body">
                                <h6 class="card-title">${patient.first_name || ''} ${patient.last_name || ''}</h6>
                                <p class="card-text">
                                    <small class="text-muted">
                                        ID: ${patient.person_id || 'N/A'} | 
                                        Documento: ${patient.document_number || 'N/A'} | 
                                        Tel: ${patient.phone_number || 'N/A'}
                                    </small>
                                </p>
                            </div>
                        </div>
                    `;
                }).join('');
                resultsEl.innerHTML = html;
                log('Results displayed successfully');
            } else {
                resultsEl.innerHTML = '<div class="alert alert-info">No se encontraron pacientes</div>';
                log('No results found');
            }
            
        } catch (error) {
            log('Error en búsqueda: ' + error.message);
            resultsEl.innerHTML = '<div class="alert alert-danger">Error en la búsqueda: ' + error.message + '</div>';
        }
    }, 300);
}

// Event listener
document.getElementById('search-input').addEventListener('input', function() {
    searchPatients(this.value);
});

// Test inicial
window.onload = function() {
    log('Página cargada. Comenzando pruebas...');
    
    // Probar con "visconte" después de 1 segundo
    setTimeout(() => {
        log('Ejecutando búsqueda de prueba: visconte');
        document.getElementById('search-input').value = 'visconte';
        searchPatients('visconte');
    }, 1000);
};
</script>

</body>
</html>
