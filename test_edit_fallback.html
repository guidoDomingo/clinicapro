<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Edición Fallback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h5><i class="fas fa-flask"></i> Prueba del Sistema de Edición Fallback</h5>
        </div>
        <div class="card-body">
            <div class="alert alert-info">
                <i class="fas fa-info-circle"></i>
                <strong>Propósito:</strong> Esta página prueba el sistema de edición fallback sin ConsultasManager
            </div>
            
            <!-- Formulario de prueba -->
            <div class="row">
                <div class="col-md-6">
                    <h6>Datos de Consulta de Prueba</h6>
                    <div class="form-group mb-3">
                        <label for="txtmotivo">Motivo de Consulta</label>
                        <textarea class="form-control" id="txtmotivo" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="visionod">Visión OD</label>
                                <input type="text" class="form-control" id="visionod">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="visionoi">Visión OI</label>
                                <input type="text" class="form-control" id="visionoi">
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <h6>Campos de Anteojos</h6>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="od_esf">OD Esfera</label>
                                <select class="form-control select2" id="od_esf">
                                    <option value="">Seleccionar</option>
                                    <option value="-1.00">-1.00</option>
                                    <option value="-0.50">-0.50</option>
                                    <option value="0.00">0.00</option>
                                    <option value="+0.50">+0.50</option>
                                    <option value="+1.00">+1.00</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="oi_esf">OI Esfera</label>
                                <select class="form-control select2" id="oi_esf">
                                    <option value="">Seleccionar</option>
                                    <option value="-1.00">-1.00</option>
                                    <option value="-0.50">-0.50</option>
                                    <option value="0.00">0.00</option>
                                    <option value="+0.50">+0.50</option>
                                    <option value="+1.00">+1.00</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Botones de prueba -->
            <div class="mt-4">
                <h6>Pruebas de Edición</h6>
                <button class="btn btn-primary me-2" onclick="testFallbackDirect()">
                    <i class="fas fa-test-tube"></i> Probar Fallback Directo
                </button>
                <button class="btn btn-secondary me-2" onclick="simulateRealEdit()">
                    <i class="fas fa-edit"></i> Simular Edición Real
                </button>
                <button class="btn btn-info" onclick="clearForm()">
                    <i class="fas fa-broom"></i> Limpiar Formulario
                </button>
            </div>
            
            <!-- Console log -->
            <div class="mt-4">
                <h6>Log de Consola</h6>
                <div id="console-log" class="bg-dark text-light p-3 rounded" style="height: 200px; overflow-y: scroll; font-family: monospace; font-size: 12px;">
                    <div>🚀 Sistema de prueba iniciado...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Función para mostrar logs en pantalla
function logToScreen(message, type = 'info') {
    const logDiv = document.getElementById('console-log');
    const timestamp = new Date().toLocaleTimeString();
    const icon = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warn' ? '⚠️' : '📝';
    
    logDiv.innerHTML += `<div>[${timestamp}] ${icon} ${message}</div>`;
    logDiv.scrollTop = logDiv.scrollHeight;
    
    // También log a consola real
    console.log(message);
}

// Override console methods para mostrar en pantalla también
const originalLog = console.log;
const originalError = console.error;
const originalWarn = console.warn;

console.log = function(...args) {
    logToScreen(args.join(' '), 'info');
    originalLog.apply(console, args);
};

console.error = function(...args) {
    logToScreen(args.join(' '), 'error');
    originalError.apply(console, args);
};

console.warn = function(...args) {
    logToScreen(args.join(' '), 'warn');
    originalWarn.apply(console, args);
};

// Inicializar Select2
$(document).ready(function() {
    $('.select2').select2({
        width: '100%'
    });
    logToScreen('✅ Select2 inicializado');
});

// IMPLEMENTAR FUNCIÓN DE FALLBACK AQUÍ
function editConsultaFallback(idConsulta, idPersona) {
    console.log('🔄 Ejecutando fallback para edición:', { idConsulta, idPersona });
    
    // Datos simulados de consulta para prueba
    const simulatedData = {
        id_consulta: idConsulta,
        txtmotivo: 'Control de rutina - consulta editada',
        visionod: '20/20',
        visionoi: '20/25',
        od_esf: '-0.50',
        oi_esf: '-1.00',
        tensionod: '15',
        tensionoi: '16'
    };
    
    console.log('📊 Datos simulados de consulta:', simulatedData);
    
    // Determinar tipo de formulario
    const tipoFormulario = simulatedData.od_esf ? 'anteojos' : 'general';
    console.log('📋 Tipo determinado:', tipoFormulario);
    
    // Poblar formulario
    setTimeout(() => {
        populateFormFallback(simulatedData, tipoFormulario);
        showEditingModeFallback(idConsulta);
    }, 500);
}

// Función para poblar formulario
function populateFormFallback(data, tipoFormulario) {
    console.log(`📝 Poblando formulario ${tipoFormulario} con datos:`, data);
    
    // Campos básicos
    const fields = ['txtmotivo', 'visionod', 'visionoi'];
    fields.forEach(fieldId => {
        const field = document.getElementById(fieldId);
        if (field && data[fieldId] !== undefined) {
            field.value = data[fieldId] || '';
            console.log(`✅ Campo ${fieldId} poblado:`, data[fieldId]);
        }
    });
    
    // Campos de anteojos con Select2
    if (tipoFormulario === 'anteojos') {
        const anteojosFields = ['od_esf', 'oi_esf'];
        anteojosFields.forEach(fieldId => {
            const field = document.getElementById(fieldId);
            if (field && data[fieldId] !== undefined) {
                $(field).val(data[fieldId]).trigger('change');
                console.log(`👓 Campo anteojos ${fieldId} poblado:`, data[fieldId]);
            }
        });
    }
    
    console.log(`✅ Consulta #${data.id_consulta} cargada para edición en formulario ${tipoFormulario}`);
}

// Mostrar banner de edición
function showEditingModeFallback(idConsulta) {
    // Remover banner existente
    const existingBanner = document.querySelector('.editing-banner');
    if (existingBanner) {
        existingBanner.remove();
    }
    
    const banner = document.createElement('div');
    banner.className = 'alert alert-warning editing-banner';
    banner.innerHTML = `
        <i class="fas fa-edit"></i>
        <strong>Modo Edición:</strong> Está editando la consulta #${idConsulta}
        <button type="button" class="btn btn-sm btn-outline-secondary ms-2" onclick="clearForm()">
            <i class="fas fa-times"></i> Cancelar Edición
        </button>
    `;
    
    const container = document.querySelector('.container');
    container.insertBefore(banner, container.firstChild);
    
    console.log(`🎨 Banner de edición mostrado para consulta #${idConsulta}`);
}

// Funciones de prueba
function testFallbackDirect() {
    logToScreen('🧪 Iniciando prueba de fallback directo...', 'info');
    editConsultaFallback(123, 45);
}

function simulateRealEdit() {
    logToScreen('🎭 Simulando edición real (sin ConsultasManager)...', 'info');
    
    // Simular que no tenemos ConsultasManager
    if (window.consultasManager) {
        delete window.consultasManager;
    }
    
    // Simular el flujo completo
    const idConsulta = 456;
    const idPersona = 78;
    
    logToScreen(`📋 Intentando editar consulta ${idConsulta} para paciente ${idPersona}`);
    
    // Aquí iría el código que detecta que no hay ConsultasManager
    logToScreen('⚠️ ConsultasManager no disponible, usando fallback');
    editConsultaFallback(idConsulta, idPersona);
}

function clearForm() {
    // Limpiar campos
    document.getElementById('txtmotivo').value = '';
    document.getElementById('visionod').value = '';
    document.getElementById('visionoi').value = '';
    $('#od_esf').val('').trigger('change');
    $('#oi_esf').val('').trigger('change');
    
    // Remover banner
    const banner = document.querySelector('.editing-banner');
    if (banner) {
        banner.remove();
    }
    
    logToScreen('🧹 Formulario limpiado', 'success');
}

// Log inicial
logToScreen('🚀 Sistema de prueba cargado y listo');
logToScreen('💡 Puedes usar los botones para probar el sistema de fallback');
</script>

</body>
</html>
