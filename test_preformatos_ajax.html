<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AJAX Preformatos</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { border: 1px solid #ddd; margin: 10px 0; padding: 15px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border: 1px solid #ccc; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Test AJAX Preformatos</h1>
    
    <div class="test-section">
        <h3>Test 1: Obtener Motivos Comunes</h3>
        <button onclick="testMotivosComunes()">Ejecutar Test</button>
        <div id="resultado1"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 2: Obtener Preformatos</h3>
        <button onclick="testPreformatos()">Ejecutar Test</button>
        <div id="resultado2"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 3: Obtener Doctor por User ID</h3>
        <input type="number" id="userId" value="1" placeholder="User ID">
        <button onclick="testDoctor()">Ejecutar Test</button>
        <div id="resultado3"></div>
    </div>

    <script>
        function mostrarResultado(elementId, xhr, response) {
            const element = document.getElementById(elementId);
            let html = '';
            
            html += '<p><strong>Status:</strong> ' + xhr.status + ' ' + xhr.statusText + '</p>';
            html += '<p><strong>Response Headers:</strong></p>';
            html += '<pre>' + xhr.getAllResponseHeaders() + '</pre>';
            html += '<p><strong>Raw Response:</strong></p>';
            html += '<pre>' + JSON.stringify(xhr.responseText, null, 2) + '</pre>';
            
            if (response) {
                html += '<p><strong>Parsed JSON:</strong></p>';
                html += '<pre>' + JSON.stringify(response, null, 2) + '</pre>';
            }
            
            element.innerHTML = html;
        }
        
        function testMotivosComunes() {
            $.ajax({
                type: 'POST',
                url: 'ajax/preformatos.ajax.php',
                data: {
                    operacion: 'getMotivosComunes',
                    tipo_formulario: 'general'
                },
                dataType: 'json',
                success: function(response, textStatus, xhr) {
                    mostrarResultado('resultado1', xhr, response);
                    $('#resultado1').prepend('<p class="success">✅ Success</p>');
                },
                error: function(xhr, textStatus, errorThrown) {
                    mostrarResultado('resultado1', xhr, null);
                    $('#resultado1').prepend('<p class="error">❌ Error: ' + textStatus + ' - ' + errorThrown + '</p>');
                }
            });
        }
        
        function testPreformatos() {
            $.ajax({
                type: 'POST',
                url: 'ajax/preformatos.ajax.php',
                data: {
                    operacion: 'getPreformatos',
                    tipo: 'consulta',
                    tipoFormulario: 'general'
                },
                dataType: 'json',
                success: function(response, textStatus, xhr) {
                    mostrarResultado('resultado2', xhr, response);
                    $('#resultado2').prepend('<p class="success">✅ Success</p>');
                },
                error: function(xhr, textStatus, errorThrown) {
                    mostrarResultado('resultado2', xhr, null);
                    $('#resultado2').prepend('<p class="error">❌ Error: ' + textStatus + ' - ' + errorThrown + '</p>');
                }
            });
        }
        
        function testDoctor() {
            const userId = document.getElementById('userId').value;
            $.ajax({
                type: 'POST',
                url: 'ajax/preformatos.ajax.php',
                data: {
                    operacion: 'getDoctorByUserId',
                    user_id: userId
                },
                dataType: 'json',
                success: function(response, textStatus, xhr) {
                    mostrarResultado('resultado3', xhr, response);
                    $('#resultado3').prepend('<p class="success">✅ Success</p>');
                },
                error: function(xhr, textStatus, errorThrown) {
                    mostrarResultado('resultado3', xhr, null);
                    $('#resultado3').prepend('<p class="error">❌ Error: ' + textStatus + ' - ' + errorThrown + '</p>');
                }
            });
        }
    </script>
</body>
</html>
