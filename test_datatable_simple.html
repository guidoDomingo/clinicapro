<!DOCTYPE html>
<html>
<head>
    <title>Test DataTable Turnos</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h2>Test DataTable Turnos</h2>
    
    <table id="tblTurnos" class="display">
        <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Fecha Creación</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        $(document).ready(function() {
            console.log("Iniciando DataTable...");
            
            $('#tblTurnos').DataTable({
                "processing": true,
                "ajax": {
                    "url": "ajax/turnos.ajax.php",
                    "type": "POST",
                    "data": function(d) {
                        console.log("Enviando datos:", { "accion": "obtenerTurnos" });
                        return { "accion": "obtenerTurnos" };
                    },
                    "dataType": "json",
                    "dataSrc": function(json) {
                        console.log("Respuesta AJAX completa:", json);
                        return json || [];
                    },
                    "error": function(xhr, error, thrown) {
                        console.error("Error en DataTable: ", error);
                        console.error("Detalle: ", thrown);
                        console.error("Respuesta: ", xhr.responseText);
                        console.error("Status: ", xhr.status);
                        alert("Error: " + error + " - " + thrown);
                    }
                },
                "columns": [
                    { 
                        "data": null,
                        "render": function(data, type, row, meta) {
                            return meta.row + 1;
                        }
                    },
                    { "data": "turno_nombre" },
                    { 
                        "data": "turno_descripcion",
                        "render": function(data, type, row) {
                            return data || 'Sin descripción';
                        }
                    },
                    { 
                        "data": "turno_estado",
                        "render": function(data, type, row) {
                            console.log("Estado:", data, typeof data);
                            if(data == 1 || data === true || data === 't') {
                                return '<span style="color: green;">Activo</span>';
                            } else {
                                return '<span style="color: red;">Inactivo</span>';
                            }
                        }
                    },
                    { 
                        "data": "fecha_creacion",
                        "render": function(data, type, row) {
                            if(data) {
                                return new Date(data).toLocaleDateString('es-ES');
                            }
                            return '';
                        }
                    },
                    { 
                        "data": null,
                        "render": function(data, type, row) {
                            return '<button onclick="console.log(\'Row:\', arguments[2])">Ver</button>';
                        }
                    }
                ],
                "pageLength": 10,
                "order": [[0, "desc"]]
            });
        });
    </script>
</body>
</html>
