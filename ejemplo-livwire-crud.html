<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo Livewire CRUD - Consultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container-fluid mt-4">
        <h2><i class="fas fa-stethoscope"></i> Sistema Livewire CRUD - Consultas</h2>
        
        <!-- Selector de Tipo de Formulario -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Tipo de Formulario</h5>
            </div>
            <div class="card-body">
                <div class="btn-group" role="group">
                    <button class="btn btn-primary" data-form-type="general" wire:click="changeFormType('general')">
                        <i class="fas fa-clipboard"></i> General
                    </button>
                    <button class="btn btn-outline-primary" data-form-type="anteojos" wire:click="changeFormType('anteojos')">
                        <i class="fas fa-glasses"></i> Anteojos
                    </button>
                    <button class="btn btn-outline-primary" data-form-type="estudios" wire:click="changeFormType('estudios')">
                        <i class="fas fa-microscope"></i> Estudios
                    </button>
                    <button class="btn btn-outline-primary" data-form-type="informe_imagen" wire:click="changeFormType('informe_imagen')">
                        <i class="fas fa-image"></i> Informe + Imagen
                    </button>
                </div>
            </div>
        </div>

        <!-- Selector de Paciente -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Información del Paciente</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label">Buscar Paciente</label>
                        <input type="text" class="form-control" placeholder="Nombre, apellido o documento..." 
                               wire:model="patientSearch" wire:change="searchPatients">
                        <input type="hidden" wire:model="id_persona" id="idPersona">
                        
                        <!-- Dropdown de resultados -->
                        <div id="patient-dropdown" wire:if="patients.length > 0">
                            <!-- Se llena dinámicamente -->
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="alert alert-info" wire:if="paciente_nombre">
                            <strong wire:text="paciente_nombre + ' ' + paciente_apellido"></strong><br>
                            <small>Doc: <span wire:text="paciente_documento"></span></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formularios -->
        <form wire:submit="save">
            
            <!-- Campos Comunes -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Datos de la Consulta</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Motivo de Consulta <span class="text-danger">*</span></label>
                                <textarea class="form-control" rows="3" 
                                         wire:model="txtmotivo" 
                                         placeholder="Describa el motivo de la consulta..."></textarea>
                                <div class="invalid-feedback wire-error" wire:if="errors.txtmotivo">
                                    <span wire:text="errors.txtmotivo[0]"></span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="mb-3">
                                <label class="form-label">Visión OD</label>
                                <input type="text" class="form-control" wire:model="visionod">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="mb-3">
                                <label class="form-label">Visión OI</label>
                                <input type="text" class="form-control" wire:model="visionoi">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-3">
                            <div class="mb-3">
                                <label class="form-label">Tensión OD</label>
                                <input type="text" class="form-control" wire:model="tensionod">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="mb-3">
                                <label class="form-label">Tensión OI</label>
                                <input type="text" class="form-control" wire:model="tensionoi">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Próxima Consulta</label>
                                <input type="date" class="form-control" wire:model="proximaconsulta">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulario Específico - Anteojos -->
            <div class="card mb-4" wire:if="formType === 'anteojos'">
                <div class="card-header bg-info text-white">
                    <h5><i class="fas fa-glasses"></i> Datos de Anteojos</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <!-- Ojo Derecho -->
                        <div class="col-md-6">
                            <h6 class="text-info">Ojo Derecho (OD)</h6>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Esfera <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" wire:model="od_esf">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Cilindro</label>
                                        <input type="text" class="form-control" wire:model="od_cil">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Eje</label>
                                        <input type="text" class="form-control" wire:model="od_eje">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">ADD</label>
                                        <input type="text" class="form-control" wire:model="od_add">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Ojo Izquierdo -->
                        <div class="col-md-6">
                            <h6 class="text-info">Ojo Izquierdo (OI)</h6>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Esfera <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" wire:model="oi_esf">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Cilindro</label>
                                        <input type="text" class="form-control" wire:model="oi_cil">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Eje</label>
                                        <input type="text" class="form-control" wire:model="oi_eje">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">ADD</label>
                                        <input type="text" class="form-control" wire:model="oi_add">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Observaciones</label>
                        <textarea class="form-control" rows="3" wire:model="observaciones_anteojos"></textarea>
                    </div>
                </div>
            </div>

            <!-- Formulario Específico - Estudios -->
            <div class="card mb-4" wire:if="formType === 'estudios'">
                <div class="card-header bg-success text-white">
                    <h5><i class="fas fa-microscope"></i> Datos de Estudios</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Tipo de Estudio <span class="text-danger">*</span></label>
                                <select class="form-select" wire:model="tipo_estudio">
                                    <option value="">Seleccione...</option>
                                    <option value="campimetria">Campimetría</option>
                                    <option value="oct">OCT</option>
                                    <option value="angiografia">Angiografía</option>
                                    <option value="ecografia">Ecografía</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" rows="3" wire:model="descripcion_estudio"></textarea>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Resultado</label>
                        <textarea class="form-control" rows="4" wire:model="resultado_estudio"></textarea>
                    </div>
                </div>
            </div>

            <!-- Formulario Específico - Informe + Imagen -->
            <div class="card mb-4" wire:if="formType === 'informe_imagen'">
                <div class="card-header bg-warning text-dark">
                    <h5><i class="fas fa-image"></i> Informe + Imagen</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Texto del Informe <span class="text-danger">*</span></label>
                        <textarea class="form-control" rows="6" wire:model="informe_texto"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Observaciones</label>
                        <textarea class="form-control" rows="3" wire:model="observaciones_informe"></textarea>
                    </div>
                </div>
            </div>

            <!-- Campos Adicionales -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Información Adicional</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Consulta</label>
                                <textarea class="form-control" rows="4" wire:model="consulta_textarea"></textarea>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Receta</label>
                                <textarea class="form-control" rows="4" wire:model="receta_textarea"></textarea>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label">Nota</label>
                                <textarea class="form-control" rows="2" wire:model="txtnota"></textarea>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label">WhatsApp</label>
                                <input type="text" class="form-control" wire:model="whatsapptxt">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" wire:model="email">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="card">
                <div class="card-body">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" wire:loading.attr="disabled">
                            <span wire:loading style="display: none;">
                                <span class="spinner-border spinner-border-sm me-2"></span>
                            </span>
                            <i class="fas fa-save"></i>
                            <span wire:text="isEditing ? 'Actualizar Consulta' : 'Guardar Consulta'"></span>
                        </button>
                        
                        <button type="button" class="btn btn-secondary" wire:click="reset">
                            <i class="fas fa-times"></i> Limpiar
                        </button>
                        
                        <button type="button" class="btn btn-info" wire:click="refresh">
                            <i class="fas fa-refresh"></i> Actualizar
                        </button>
                    </div>
                </div>
            </div>
        </form>

        <!-- Estado del Sistema (Solo Debug) -->
        <div class="card mt-4" style="display: none;" id="debug-panel">
            <div class="card-header">
                <h6>Estado del Sistema (Debug)</h6>
            </div>
            <div class="card-body">
                <pre id="debug-state"></pre>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="modules/consultas/components/LivewireCRUD.js"></script>
    <script src="modules/consultas/components/LivewireFormIntegrator.js"></script>
    
    <script>
        // Configuración
        const APP_CONFIG = {
            endpoints: {
                livwireCrud: 'modules/consultas/api/livwire-crud.php'
            },
            debug: true
        };

        // Inicializar sistema
        document.addEventListener('DOMContentLoaded', function() {
            // Crear instancia del sistema CRUD
            const livwireCRUD = new LivewireCRUD({
                endpoint: APP_CONFIG.endpoints.livwireCrud,
                debug: APP_CONFIG.debug,
                autoSave: false,
                saveDelay: 1000
            });

            // Crear integrador de formularios
            const formIntegrator = new LivewireFormIntegrator(livwireCRUD);
            
            // Exponer API global
            window.livwireAPI = {
                crud: livwireCRUD.getPublicAPI(),
                forms: formIntegrator.getPublicAPI()
            };

            // Debug panel
            if (APP_CONFIG.debug) {
                document.getElementById('debug-panel').style.display = 'block';
                
                setInterval(() => {
                    document.getElementById('debug-state').textContent = 
                        JSON.stringify(livwireCRUD.state, null, 2);
                }, 1000);
            }

            console.log('🎉 Sistema Livwire CRUD de ejemplo inicializado');
        });
    </script>
</body>
</html>
