<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Endpoint Informe Imagen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h2>🧪 Test - Endpoint Informe Imagen</h2>
        <p class="text-muted">Prueba del endpoint guardar-consulta-informe-imagen.php</p>
        
        <div class="card">
            <div class="card-body">
                <h5>Formulario de Prueba</h5>
                <form id="testForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>ID Persona</label>
                                <input type="text" class="form-control" name="idPersona" value="81" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Form Type</label>
                                <input type="text" class="form-control" name="form_type" value="informe_imagen" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Formato Consulta</label>
                                <input type="text" class="form-control" name="formatoConsulta" value="30">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>ID Usuario</label>
                                <input type="text" class="form-control" name="id_user" value="9">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Descripción OD</label>
                                <textarea class="form-control" name="descripcion-od-textarea" rows="3"><p>Descripción ojo derecho de prueba</p></textarea>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Descripción OI</label>
                                <textarea class="form-control" name="descripcion-oi-textarea" rows="3"><p>Descripción ojo izquierdo de prueba</p></textarea>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Motivo</label>
                        <input type="text" class="form-control" name="txtmotivo" value="Consulta de prueba informe imagen">
                    </div>
                    
                    <div class="form-group">
                        <label>Equipo Médico</label>
                        <select class="form-control" name="equipoMedico">
                            <option value="">Seleccionar</option>
                            <option value="equipo1" selected>Equipo Médico 1</option>
                            <option value="equipo2">Equipo Médico 2</option>
                        </select>
                    </div>
                    
                    <input type="hidden" name="id_reserva" value="0">
                    <input type="hidden" name="txtficha" value="5004615">
                    <input type="hidden" name="txtdocumento" value="5004615">
                    
                    <button type="button" class="btn btn-primary" onclick="testEndpoint()">
                        🧪 Probar Endpoint
                    </button>
                </form>
            </div>
        </div>
        
        <div class="card mt-3">
            <div class="card-body">
                <h5>Resultado del Test</h5>
                <div id="resultado" class="alert alert-info">
                    Presiona el botón para probar el endpoint
                </div>
            </div>
        </div>
        
        <div class="card mt-3">
            <div class="card-body">
                <h5>Log de Debug</h5>
                <pre id="debug-log" class="bg-light p-3" style="max-height: 300px; overflow-y: auto;">
Esperando resultado...
                </pre>
            </div>
        </div>
    </div>

    <script>
        function testEndpoint() {
            const formData = new FormData(document.getElementById('testForm'));
            const resultadoDiv = document.getElementById('resultado');
            const debugLog = document.getElementById('debug-log');
            
            // Mostrar datos que se están enviando
            const datosEnviados = {};
            for (let [key, value] of formData.entries()) {
                datosEnviados[key] = value;
            }
            
            debugLog.textContent = 'Enviando datos:\n' + JSON.stringify(datosEnviados, null, 2) + '\n\n';
            
            resultadoDiv.className = 'alert alert-warning';
            resultadoDiv.textContent = 'Enviando solicitud...';
            
            $.ajax({
                type: 'POST',
                url: 'ajax/guardar-consulta-informe-imagen.php',
                data: formData,
                dataType: "text",
                processData: false,
                contentType: false,
                success: function(response) {
                    debugLog.textContent += 'Respuesta exitosa:\n' + response + '\n\n';
                    
                    if (response.includes('error:')) {
                        resultadoDiv.className = 'alert alert-danger';
                        resultadoDiv.innerHTML = '<strong>❌ Error:</strong> ' + response;
                    } else if (response.includes('ok id:') || response.includes('actualizado id:')) {
                        resultadoDiv.className = 'alert alert-success';
                        resultadoDiv.innerHTML = '<strong>✅ Éxito:</strong> ' + response;
                    } else {
                        resultadoDiv.className = 'alert alert-warning';
                        resultadoDiv.innerHTML = '<strong>⚠️ Respuesta inesperada:</strong> ' + response;
                    }
                },
                error: function(xhr, status, error) {
                    debugLog.textContent += 'Error AJAX:\n' + 
                        'Status: ' + status + '\n' +
                        'Error: ' + error + '\n' +
                        'Response: ' + xhr.responseText + '\n\n';
                    
                    resultadoDiv.className = 'alert alert-danger';
                    resultadoDiv.innerHTML = '<strong>💥 Error AJAX:</strong> ' + error;
                }
            });
        }
        
        // Auto-test al cargar la página
        $(document).ready(function() {
            console.log('Página de test cargada');
        });
    </script>
</body>
</html>
