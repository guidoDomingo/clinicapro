<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Configuración de Correo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔧 Debug - Configuración de Correo</h1>
    
    <div id="results"></div>
    
    <button onclick="testConnection()">Probar Conexión</button>
    <button onclick="getConfig()">Obtener Configuración</button>
    <button onclick="getLogs()">Obtener Logs</button>
    <button onclick="runFullDiagnostic()">Diagnóstico Completo</button>

    <script>
        const resultsDiv = document.getElementById('results');

        function addResult(title, data, isSuccess = true) {
            const div = document.createElement('div');
            div.className = 'result ' + (isSuccess ? 'success' : 'error');
            div.innerHTML = `
                <h3>${title}</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
            resultsDiv.appendChild(div);
        }

        function addInfo(title, message) {
            const div = document.createElement('div');
            div.className = 'result info';
            div.innerHTML = `<h3>${title}</h3><p>${message}</p>`;
            resultsDiv.appendChild(div);
        }

        async function testConnection() {
            addInfo('Probando Conexión', 'Conectando al servidor...');
            try {
                const response = await fetch('modules/mail/api/debug_mail.php?action=test');
                const data = await response.json();
                addResult('Test de Conexión', data, data.success);
            } catch (error) {
                addResult('Error de Conexión', { error: error.message }, false);
            }
        }

        async function getConfig() {
            addInfo('Obteniendo Configuración', 'Cargando configuración de correo...');
            try {
                const response = await fetch('modules/mail/api/debug_mail.php?action=get');
                const data = await response.json();
                addResult('Configuración de Correo', data, data.success);
            } catch (error) {
                addResult('Error al Obtener Configuración', { error: error.message }, false);
            }
        }

        async function getLogs() {
            addInfo('Obteniendo Logs', 'Cargando logs de correo...');
            try {
                const response = await fetch('modules/mail/api/debug_mail.php?action=logs&limit=5');
                const data = await response.json();
                addResult('Logs de Correo', data, data.success);
            } catch (error) {
                addResult('Error al Obtener Logs', { error: error.message }, false);
            }
        }

        async function runFullDiagnostic() {
            resultsDiv.innerHTML = '';
            addInfo('Diagnóstico Completo', 'Ejecutando todas las pruebas...');
            
            await testConnection();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await getConfig();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await getLogs();
            
            addInfo('Diagnóstico Completado', 'Todas las pruebas han finalizado.');
        }

        // Ejecutar diagnóstico automáticamente al cargar
        window.onload = () => {
            runFullDiagnostic();
        };
    </script>
</body>
</html>
