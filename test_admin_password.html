<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cambio de Contraseña Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container mt-5">
        <h1>Test - Cambio de Contraseña Admin</h1>
        
        <div class="card">
            <div class="card-body">
                <form id="adminPasswordForm">
                    <div class="mb-3">
                        <label for="user_id" class="form-label">ID del Usuario</label>
                        <input type="number" class="form-control" id="user_id" name="user_id" required>
                        <small class="form-text text-muted">ID del usuario al que quieres cambiar la contraseña</small>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">Nueva Contraseña</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" minlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirmar Nueva Contraseña</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <button type="submit" class="btn btn-warning">Cambiar Contraseña</button>
                </form>
                
                <div class="mt-3">
                    <h5>Debug Console:</h5>
                    <div id="debugConsole" style="background: #f8f9fa; padding: 10px; border: 1px solid #ddd; height: 200px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Función para escribir en el debug console
        function debugLog(message) {
            const console = document.getElementById('debugConsole');
            const timestamp = new Date().toLocaleTimeString();
            console.innerHTML += `[${timestamp}] ${message}<br>`;
            console.scrollTop = console.scrollHeight;
        }

        $(document).ready(function() {
            debugLog('Página cargada - sistema listo');

            $('#adminPasswordForm').on('submit', function(e) {
                e.preventDefault();
                
                const userId = $('#user_id').val();
                const newPassword = $('#new_password').val();
                const confirmPassword = $('#confirm_password').val();
                
                debugLog(`Iniciando cambio de contraseña para usuario ID: ${userId}`);
                
                // Validaciones
                if (!userId || !newPassword || !confirmPassword) {
                    debugLog('ERROR: Campos vacíos detectados');
                    Swal.fire('Error', 'Todos los campos son obligatorios', 'error');
                    return;
                }
                
                if (newPassword !== confirmPassword) {
                    debugLog('ERROR: Las contraseñas no coinciden');
                    Swal.fire('Error', 'Las contraseñas no coinciden', 'error');
                    return;
                }
                
                if (newPassword.length < 6) {
                    debugLog('ERROR: Contraseña muy corta');
                    Swal.fire('Error', 'La contraseña debe tener al menos 6 caracteres', 'error');
                    return;
                }
                
                debugLog('Validaciones completadas - preparando envío AJAX');
                
                // Preparar datos
                const data = {
                    user_id: userId,
                    new_password: newPassword
                };
                
                const url = 'api/users/admin-change-password';
                debugLog(`URL destino: ${url}`);
                debugLog(`Datos: ${JSON.stringify(data)}`);
                
                // Mostrar indicador de carga
                Swal.fire({
                    title: 'Cambiando contraseña...',
                    text: 'Por favor espera',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });
                
                $.ajax({
                    url: url,
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function(response) {
                        debugLog(`ÉXITO: ${JSON.stringify(response)}`);
                        Swal.fire({
                            icon: 'success',
                            title: 'Éxito',
                            text: 'Contraseña cambiada correctamente'
                        });
                        $('#adminPasswordForm')[0].reset();
                    },
                    error: function(xhr, status, error) {
                        debugLog(`ERROR: Status: ${status}, Error: ${error}`);
                        debugLog(`Response: ${xhr.responseText}`);
                        
                        let errorMessage = 'Error al cambiar la contraseña';
                        if (xhr.responseJSON && xhr.responseJSON.message) {
                            errorMessage = xhr.responseJSON.message;
                        }
                        
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: errorMessage
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
