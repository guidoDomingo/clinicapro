    <script>
        // Funciones de debugging adicionales
        function addDebugLog(message) {
            const debugLog = document.getElementById('debugLog');
            const timestamp = new Date().toLocaleTimeString();
            debugLog.innerHTML += `[${timestamp}] ${message}<br>`;
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        function clearDebugLog() {
            document.getElementById('debugLog').innerHTML = 'Log limpiado...<br>';
        }

        // Override del console.log para capturar en nuestro panel
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            addDebugLog(args.join(' '));
        };

        const originalError = console.error;
        console.error = function(...args) {
            originalError.apply(console, args);
            addDebugLog('❌ ERROR: ' + args.join(' '));
        };

        // Funciones de test
        function testCargarServicios() {
            const fecha = document.getElementById('fechaReserva').value;
            console.log("🧪 Ejecutando test de cargar servicios...");
            cargarServiciosPorFechaMedico(fecha, 18);
        }

        function testCargarHorarios() {
            const fecha = document.getElementById('fechaReserva').value;
            console.log("🧪 Ejecutando test de cargar horarios...");
            cargarHorariosDisponibles(4, 18, fecha); // Servicio 4 = Cirugía de prueba
        }

        function testEstadoActual() {
            const estado = {
                fechaSeleccionada: document.getElementById('fechaReserva').value,
                medicoSeleccionado: document.getElementById('selectProveedor').value,
                servicioSeleccionado: document.getElementById('selectServicio').value,
                opcionesServicio: $('#selectServicio option').length,
                contenidoDropdown: $('#selectServicio').html()
            };
            
            console.log("📊 Estado actual del sistema:", estado);
            
            document.getElementById('estadoVariables').innerHTML = `
                <strong>Fecha:</strong> ${estado.fechaSeleccionada}<br>
                <strong>Médico:</strong> ${estado.medicoSeleccionado}<br>
                <strong>Servicio:</strong> ${estado.servicioSeleccionado}<br>
                <strong>Opciones en dropdown:</strong> ${estado.opcionesServicio}<br>
                <strong>HTML del dropdown:</strong><br>
                <code style="white-space: pre-wrap;">${estado.contenidoDropdown}</code>
            `;
        }

        function testAjaxDirecto() {
            const fecha = document.getElementById('fechaReserva').value;
            console.log("📡 Ejecutando test AJAX directo...");
            
            $.ajax({
                url: "ajax/servicios.ajax.php",
                method: "POST",
                data: {
                    action: "obtenerServiciosPorFechaMedico",
                    fecha: fecha,
                    doctor_id: 18
                },
                dataType: "json",
                success: function(respuesta) {
                    console.log("📥 Respuesta AJAX directa:", respuesta);
                },
                error: function(xhr, status, error) {
                    console.error("❌ Error AJAX directo:", {xhr, status, error});
                }
            });
        }

        // Event listeners para los dropdowns
        $(document).ready(function() {
            $('#selectProveedor').on('change', function() {
                const medicoId = $(this).val();
                const fecha = $('#fechaReserva').val();
                
                if (medicoId && fecha) {
                    console.log("🔄 Médico cambiado, cargando servicios...");
                    cargarServiciosPorFechaMedico(fecha, medicoId);
                } else {
                    $('#selectServicio').html('<option value="">Seleccione fecha y médico</option>');
                }
            });

            $('#fechaReserva').on('change', function() {
                const medicoId = $('#selectProveedor').val();
                const fecha = $(this).val();
                
                if (medicoId && fecha) {
                    console.log("🔄 Fecha cambiada, cargando servicios...");
                    cargarServiciosPorFechaMedico(fecha, medicoId);
                }
            });

            $('#selectServicio').on('change', function() {
                const servicioId = $(this).val();
                const medicoId = $('#selectProveedor').val();
                const fecha = $('#fechaReserva').val();
                
                if (servicioId && medicoId && fecha) {
                    console.log("🔄 Servicio cambiado, cargando horarios...");
                    cargarHorariosDisponibles(servicioId, medicoId, fecha);
                }
            });
            
            addDebugLog("🎉 Sistema de debug inicializado correctamente");
        });
    </script>
