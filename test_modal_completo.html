<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modal Consulta</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>🧪 Test de Modal de Consulta</h2>
    
    <div class="alert alert-info">
        <strong>Objetivo:</strong> Verificar que el modal de consulta muestre archivos y datos específicos de anteojos.
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5>Test Manual</h5>
                </div>
                <div class="card-body">
                    <label for="testIdConsulta">ID de Consulta:</label>
                    <input type="number" id="testIdConsulta" class="form-control" placeholder="Ej: 1">
                    <button onclick="testModalManual()" class="btn btn-primary mt-2">
                        🔍 Test Modal Manual
                    </button>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5>Consultas de Anteojos Disponibles</h5>
                </div>
                <div class="card-body" id="consultasDisponibles">
                    <button onclick="cargarConsultasAnteojos()" class="btn btn-info">
                        📋 Cargar Consultas
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row mt-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h5>📊 Log de Actividad</h5>
                </div>
                <div class="card-body">
                    <pre id="logOutput" style="height: 300px; overflow-y: auto; background: #f8f9fa; padding: 10px;"></pre>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
let logContainer = document.getElementById('logOutput');

function log(message) {
    const timestamp = new Date().toLocaleTimeString();
    logContainer.innerHTML += `[${timestamp}] ${message}\n`;
    logContainer.scrollTop = logContainer.scrollHeight;
    console.log(message);
}

function cargarConsultasAnteojos() {
    log('🔍 Cargando consultas de anteojos disponibles...');
    
    $.ajax({
        url: 'test_modal_consulta.php',
        type: 'GET',
        success: function(response) {
            document.getElementById('consultasDisponibles').innerHTML = response;
            log('✅ Consultas cargadas correctamente');
        },
        error: function(xhr, status, error) {
            log('❌ Error al cargar consultas: ' + error);
        }
    });
}

function testModalManual() {
    const idConsulta = document.getElementById('testIdConsulta').value;
    if (!idConsulta) {
        log('⚠️ Por favor ingresa un ID de consulta');
        return;
    }
    
    log(`🧪 Iniciando test manual para consulta ID: ${idConsulta}`);
    testModal(idConsulta);
}

function testModal(idConsulta) {
    log(`🔄 Testing modal para consulta ID: ${idConsulta}`);
    
    // Test 1: Obtener detalle de consulta
    const formData1 = new FormData();
    formData1.append('id_consulta', idConsulta);
    formData1.append('operacion', 'detalleConsulta');
    
    $.ajax({
        type: 'POST',
        url: 'ajax/consultas.ajax.php',
        data: formData1,
        dataType: "json",
        processData: false,
        contentType: false,
        success: function(response) {
            log('✅ Detalle de consulta recibido');
            log(`   📋 Tipo: ${response.tipo_formulario}`);
            log(`   📊 Tiene datos específicos: ${response.datos_especificos ? 'Sí' : 'No'}`);
            
            if (response.datos_especificos) {
                try {
                    const datosAnteojos = JSON.parse(response.datos_especificos);
                    log(`   👓 Datos de anteojos parseados correctamente`);
                    log(`   👁️ OD Esfera: ${datosAnteojos.od_esf || 'No especificado'}`);
                    log(`   👁️ OI Esfera: ${datosAnteojos.oi_esf || 'No especificado'}`);
                } catch (e) {
                    log(`   ❌ Error al parsear datos específicos: ${e.message}`);
                }
            }
            
            // Test 2: Obtener archivos de consulta
            const formData2 = new FormData();
            formData2.append('id_consulta', idConsulta);
            formData2.append('operacion', 'archivosPorConsulta');
            
            $.ajax({
                type: 'POST',
                url: 'ajax/archivos.ajax.php',
                data: formData2,
                dataType: "json",
                processData: false,
                contentType: false,
                success: function(archivosResponse) {
                    log('✅ Archivos recibidos');
                    log(`   📁 Cantidad: ${archivosResponse.data ? archivosResponse.data.length : 0}`);
                    log(`   📁 Status: ${archivosResponse.status}`);
                    
                    if (archivosResponse.data && archivosResponse.data.length > 0) {
                        archivosResponse.data.forEach((archivo, index) => {
                            log(`   📄 Archivo ${index + 1}: ${archivo.nombre_archivo} (${archivo.tamano_mb} MB)`);
                        });
                    }
                    
                    // Test 3: Ejecutar función verDetalleConsulta si existe
                    log('🎯 Intentando ejecutar verDetalleConsulta...');
                    try {
                        if (typeof verDetalleConsulta === 'function') {
                            verDetalleConsulta(idConsulta);
                            log('✅ Función verDetalleConsulta ejecutada');
                        } else {
                            log('⚠️ Función verDetalleConsulta no está disponible');
                            // Cargar el script de consultas
                            loadConsultasScript();
                        }
                    } catch (e) {
                        log(`❌ Error al ejecutar verDetalleConsulta: ${e.message}`);
                    }
                },
                error: function(xhr, status, error) {
                    log(`❌ Error al obtener archivos: ${error}`);
                    log(`   📤 Status: ${status}`);
                    log(`   📤 Response: ${xhr.responseText}`);
                }
            });
        },
        error: function(xhr, status, error) {
            log(`❌ Error al obtener detalle de consulta: ${error}`);
            log(`   📤 Status: ${status}`);
            log(`   📤 Response: ${xhr.responseText}`);
        }
    });
}

function loadConsultasScript() {
    log('📦 Cargando script de consultas...');
    const script = document.createElement('script');
    script.src = 'view/js/consultas.js';
    script.onload = function() {
        log('✅ Script de consultas cargado');
    };
    script.onerror = function() {
        log('❌ Error al cargar script de consultas');
    };
    document.head.appendChild(script);
}

// Cargar automáticamente las consultas al inicio
window.onload = function() {
    log('🚀 Página cargada, iniciando diagnóstico...');
    cargarConsultasAnteojos();
};
</script>

</body>
</html>
