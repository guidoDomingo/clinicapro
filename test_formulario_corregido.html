<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Formulario Informe + Imagen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h2>Prueba Formulario Informe + Imagen - Corregido</h2>
        
        <div class="alert alert-info">
            <strong>Estado:</strong> Error de sintaxis PHP corregido ✅<br>
            <strong>Cambios:</strong> Se añadió la llave de cierre faltante para el bloque POST<br>
            <strong>Verificación:</strong> php -l ajax/guardar-consulta-informe-imagen.php ✅
        </div>
        
        <form id="formTest" method="POST">
            <input type="hidden" name="form_type" value="informe_imagen">
            <input type="hidden" name="formatoConsulta" value="30">
            <input type="hidden" name="idPersona" value="123">
            <input type="hidden" name="id_user" value="1">
            
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">Motivo:</label>
                    <input type="text" name="txtmotivo" class="form-control" value="Prueba informe imagen" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Equipo Médico:</label>
                    <input type="text" name="equipoMedico" class="form-control" value="Retinógrafo digital">
                </div>
            </div>
            
            <div class="row mt-3">
                <div class="col-md-6">
                    <label class="form-label">Descripción OD:</label>
                    <textarea name="descripcion-od-textarea" class="form-control" rows="3">Retina normal, sin alteraciones</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Descripción OI:</label>
                    <textarea name="descripcion-oi-textarea" class="form-control" rows="3">Retina normal, sin alteraciones</textarea>
                </div>
            </div>
            
            <div class="mt-3">
                <label class="form-label">Consulta:</label>
                <textarea name="consulta-textarea" class="form-control" rows="2">Examen de fondo de ojo realizado</textarea>
            </div>
            
            <div class="mt-3">
                <label class="form-label">Emails para compartir:</label>
                <input type="text" name="txtEmailShare" class="form-control" value="test@ejemplo.com">
            </div>
            
            <div class="mt-4">
                <button type="button" id="btnProbar" class="btn btn-primary">Probar Endpoint</button>
                <button type="button" id="btnLimpiar" class="btn btn-secondary">Limpiar Log</button>
            </div>
        </form>
        
        <div class="mt-4">
            <h4>Resultado:</h4>
            <div id="resultado" class="alert alert-secondary">Esperando prueba...</div>
        </div>
        
        <div class="mt-4">
            <h4>Log de Debug:</h4>
            <textarea id="logArea" class="form-control" rows="10" readonly></textarea>
        </div>
    </div>

    <script>
    $(document).ready(function() {
        $('#btnProbar').click(function() {
            var formData = $('#formTest').serialize();
            
            $('#resultado').removeClass().addClass('alert alert-info').html('Enviando datos...');
            
            $.ajax({
                url: '/clinica/ajax/guardar-consulta-informe-imagen.php',
                type: 'POST',
                data: formData,
                success: function(response) {
                    console.log('Respuesta exitosa:', response);
                    $('#resultado').removeClass().addClass('alert alert-success')
                        .html('<strong>Éxito:</strong> ' + response);
                    cargarLog();
                },
                error: function(xhr, status, error) {
                    console.log('Error:', error);
                    console.log('Respuesta:', xhr.responseText);
                    $('#resultado').removeClass().addClass('alert alert-danger')
                        .html('<strong>Error:</strong> ' + xhr.responseText + '<br><strong>Status:</strong> ' + status);
                    cargarLog();
                }
            });
        });
        
        $('#btnLimpiar').click(function() {
            $('#logArea').val('');
            $('#resultado').removeClass().addClass('alert alert-secondary').html('Log limpiado...');
        });
        
        function cargarLog() {
            // Simular carga de log (en la implementación real cargarías desde el archivo de log)
            setTimeout(function() {
                $('#logArea').val($('#logArea').val() + 
                    '\n[' + new Date().toLocaleTimeString() + '] Prueba realizada\n' +
                    'Form data enviado: ' + $('#formTest').serialize() + '\n' +
                    'Respuesta: ' + $('#resultado').text() + '\n');
                $('#logArea').scrollTop($('#logArea')[0].scrollHeight);
            }, 500);
        }
    });
    </script>
</body>
</html>
