<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Final - obtenerDoctoresPorFecha</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-container { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #resultado { margin-top: 20px; }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>🎯 Test Final: obtenerDoctoresPorFecha CORREGIDO</h1>
    
    <div class="test-container">
        <h2>📋 Información del Test</h2>
        <p><strong>Fecha objetivo:</strong> 2025-07-17 (JUEVES)</p>
        <p><strong>Método usado:</strong> ctrObtenerMedicosDisponiblesPorFecha (el que funciona)</p>
        <p><strong>Timestamp:</strong> <span id="timestamp"></span></p>
    </div>
    
    <div class="test-container">
        <h2>🧪 Test de Funcionalidad</h2>
        <button onclick="testObtenerDoctoresPorFecha()">Probar obtenerDoctoresPorFecha</button>
        <button onclick="testComparacion()">Comparar con método original</button>
        <div id="resultado"></div>
    </div>
    
    <script>
        // Mostrar timestamp
        document.getElementById('timestamp').textContent = new Date().toLocaleString();
        
        function testObtenerDoctoresPorFecha() {
            $('#resultado').html('<div class="info">🔄 Probando obtenerDoctoresPorFecha...</div>');
            
            $.ajax({
                url: 'ajax/servicios.ajax.php',
                method: 'POST',
                data: {
                    action: 'obtenerDoctoresPorFecha',
                    fecha: '2025-07-17'
                },
                dataType: 'json',
                success: function(response) {
                    console.log('Respuesta obtenerDoctoresPorFecha:', response);
                    
                    let html = '<h3>✅ Resultado de obtenerDoctoresPorFecha:</h3>';
                    html += '<pre>' + JSON.stringify(response, null, 2) + '</pre>';
                    
                    if (response.status === 'success' && response.data && response.data.length > 0) {
                        html += '<div class="success">🎉 ¡ÉXITO! Se encontraron ' + response.data.length + ' doctores</div>';
                        html += '<h4>👨‍⚕️ Doctores encontrados:</h4>';
                        response.data.forEach((doctor, index) => {
                            html += '<div style="margin: 10px 0; padding: 10px; background: #e8f5e8; border-radius: 5px;">';
                            html += '<strong>Doctor ' + (index + 1) + ':</strong><br>';
                            html += 'ID: ' + doctor.doctor_id + '<br>';
                            html += 'Nombre: ' + doctor.nombre_doctor + '<br>';
                            html += 'Estado: ' + doctor.doctor_estado + '<br>';
                            html += '</div>';
                        });
                    } else {
                        html += '<div class="error">❌ Error: No se encontraron doctores</div>';
                    }
                    
                    $('#resultado').html(html);
                },
                error: function(xhr, status, error) {
                    console.error('Error AJAX:', error);
                    $('#resultado').html('<div class="error">❌ Error AJAX: ' + error + '</div>');
                }
            });
        }
        
        function testComparacion() {
            $('#resultado').html('<div class="info">🔄 Comparando métodos...</div>');
            
            // Test del método que funciona
            $.ajax({
                url: 'ajax/servicios.ajax.php',
                method: 'POST',
                data: {
                    action: 'obtenerMedicosPorFecha',
                    fecha: '2025-07-17'
                },
                dataType: 'json',
                success: function(originalResponse) {
                    console.log('Respuesta método original:', originalResponse);
                    
                    // Test del método corregido
                    $.ajax({
                        url: 'ajax/servicios.ajax.php',
                        method: 'POST',
                        data: {
                            action: 'obtenerDoctoresPorFecha',
                            fecha: '2025-07-17'
                        },
                        dataType: 'json',
                        success: function(newResponse) {
                            console.log('Respuesta método corregido:', newResponse);
                            
                            let html = '<h3>📊 Comparación de Métodos:</h3>';
                            
                            html += '<div style="display: flex; gap: 20px;">';
                            
                            // Método original
                            html += '<div style="flex: 1; border: 1px solid #ddd; padding: 15px; border-radius: 5px;">';
                            html += '<h4>🟢 obtenerMedicosPorFecha (ORIGINAL que funciona):</h4>';
                            html += '<div class="success">Doctores: ' + (originalResponse.data ? originalResponse.data.length : 0) + '</div>';
                            html += '<pre style="font-size: 12px;">' + JSON.stringify(originalResponse, null, 2) + '</pre>';
                            html += '</div>';
                            
                            // Método corregido
                            html += '<div style="flex: 1; border: 1px solid #ddd; padding: 15px; border-radius: 5px;">';
                            html += '<h4>🔧 obtenerDoctoresPorFecha (CORREGIDO):</h4>';
                            html += '<div class="' + (newResponse.data && newResponse.data.length > 0 ? 'success' : 'error') + '">Doctores: ' + (newResponse.data ? newResponse.data.length : 0) + '</div>';
                            html += '<pre style="font-size: 12px;">' + JSON.stringify(newResponse, null, 2) + '</pre>';
                            html += '</div>';
                            
                            html += '</div>';
                            
                            // Análisis
                            html += '<div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px;">';
                            html += '<h4>📈 Análisis:</h4>';
                            
                            const originalCount = originalResponse.data ? originalResponse.data.length : 0;
                            const newCount = newResponse.data ? newResponse.data.length : 0;
                            
                            if (originalCount === newCount && newCount > 0) {
                                html += '<div class="success">✅ ¡PERFECTO! Ambos métodos devuelven la misma cantidad de doctores (' + newCount + ')</div>';
                                html += '<div class="success">✅ El problema ha sido resuelto completamente</div>';
                            } else if (newCount > 0) {
                                html += '<div class="success">✅ El método corregido funciona (devuelve ' + newCount + ' doctores)</div>';
                                html += '<div class="info">ℹ️ Diferencia con original: ' + (newCount - originalCount) + ' doctores</div>';
                            } else {
                                html += '<div class="error">❌ El método corregido aún no funciona correctamente</div>';
                            }
                            
                            html += '</div>';
                            
                            $('#resultado').html(html);
                        },
                        error: function(xhr, status, error) {
                            $('#resultado').html('<div class="error">❌ Error en método corregido: ' + error + '</div>');
                        }
                    });
                },
                error: function(xhr, status, error) {
                    $('#resultado').html('<div class="error">❌ Error en método original: ' + error + '</div>');
                }
            });
        }
        
        // Auto-ejecutar test al cargar
        $(document).ready(function() {
            setTimeout(testObtenerDoctoresPorFecha, 1000);
        });
    </script>
</body>
</html>
