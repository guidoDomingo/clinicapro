<!DOCTYPE html>
<html>
<head>
    <title>Test Summernote</title>
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote.min.js"></script>
</head>
<body>
    <h1>Test de Summernote</h1>
    
    <form id="test-form">
        <div>
            <label>Contenido:</label>
            <textarea id="obs-preformato" name="contenido" required></textarea>
        </div>
        <br>
        <button type="button" onclick="testContenido()">Test Contenido</button>
        <button type="submit">Submit</button>
    </form>
    
    <div id="output"></div>
    
    <script>
        $(document).ready(function() {
            $('#obs-preformato').summernote({
                height: 200,
                placeholder: 'Escriba contenido aquí...'
            });
        });
        
        function testContenido() {
            let contenido1 = $('#obs-preformato').summernote('code');
            let contenido2 = $('#obs-preformato').val();
            
            console.log('Summernote code:', contenido1);
            console.log('Textarea val:', contenido2);
            console.log('Tipo contenido1:', typeof contenido1);
            console.log('Tipo contenido2:', typeof contenido2);
            
            document.getElementById('output').innerHTML = 
                '<h3>Resultados:</h3>' +
                '<p><strong>Summernote code:</strong> ' + JSON.stringify(contenido1) + '</p>' +
                '<p><strong>Textarea val:</strong> ' + JSON.stringify(contenido2) + '</p>' +
                '<p><strong>Tipo 1:</strong> ' + typeof contenido1 + '</p>' +
                '<p><strong>Tipo 2:</strong> ' + typeof contenido2 + '</p>';
        }
        
        $('#test-form').on('submit', function(e) {
            e.preventDefault();
            
            let contenido = $('#obs-preformato').summernote('code');
            console.log('Contenido al enviar:', contenido);
            
            // Simular FormData
            let formData = new FormData();
            formData.append('contenido', contenido);
            
            console.log('FormData contenido:', formData.get('contenido'));
        });
    </script>
</body>
</html>
