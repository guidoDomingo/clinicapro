<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba CRUD Tipos de Formularios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .info { color: blue; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>🧪 Prueba del CRUD de Tipos de Formularios</h1>
        
        <!-- Resultados de las pruebas -->
        <div id="resultados"></div>
        
        <!-- Formulario de prueba -->
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>📝 Crear Nuevo Tipo de Formulario</h5>
                    </div>
                    <div class="card-body">
                        <form id="formTipoFormulario">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="codigo" class="form-label">Código</label>
                                <input type="text" class="form-control" id="codigo" name="codigo" required>
                            </div>
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="activo" name="activo" checked>
                                <label class="form-check-label" for="activo">Activo</label>
                            </div>
                            <button type="submit" class="btn btn-primary">Crear Tipo de Formulario</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>📋 Lista de Tipos de Formularios</h5>
                        <button class="btn btn-sm btn-outline-primary" onclick="cargarTipos()">
                            🔄 Actualizar Lista
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="listaTipos">
                            <p class="text-muted">Cargando...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Cargar tipos al inicio
            cargarTipos();
            
            // Manejar envío del formulario
            $('#formTipoFormulario').on('submit', function(e) {
                e.preventDefault();
                crearTipoFormulario();
            });
        });
        
        function cargarTipos() {
            $.ajax({
                url: 'ajax/tipos_formularios.php',
                method: 'GET',
                data: { accion: 'listar' },
                dataType: 'json',
                success: function(response) {
                    if (response.success) {
                        mostrarTipos(response.data);
                    } else {
                        $('#listaTipos').html('<div class="alert alert-danger">Error: ' + response.message + '</div>');
                    }
                },
                error: function(xhr, status, error) {
                    $('#listaTipos').html('<div class="alert alert-danger">Error de conexión: ' + error + '</div>');
                }
            });
        }
        
        function mostrarTipos(tipos) {
            let html = '';
            if (tipos && tipos.length > 0) {
                html = '<div class="table-responsive"><table class="table table-sm">';
                html += '<thead><tr><th>ID</th><th>Nombre</th><th>Código</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>';
                
                tipos.forEach(function(tipo) {
                    const estadoClass = tipo.activo === 't' || tipo.activo === true ? 'success' : 'secondary';
                    const estadoText = tipo.activo === 't' || tipo.activo === true ? 'Activo' : 'Inactivo';
                    
                    html += '<tr>';
                    html += '<td>' + tipo.id + '</td>';
                    html += '<td>' + tipo.nombre + '</td>';
                    html += '<td>' + tipo.codigo + '</td>';
                    html += '<td><span class="badge bg-' + estadoClass + '">' + estadoText + '</span></td>';
                    html += '<td>';
                    html += '<button class="btn btn-sm btn-outline-danger" onclick="eliminarTipo(' + tipo.id + ')">🗑️</button>';
                    html += '</td>';
                    html += '</tr>';
                });
                
                html += '</tbody></table></div>';
            } else {
                html = '<div class="alert alert-info">No hay tipos de formularios registrados</div>';
            }
            
            $('#listaTipos').html(html);
        }
        
        function crearTipoFormulario() {
            const formData = new FormData($('#formTipoFormulario')[0]);
            formData.append('accion', 'crear');
            
            $.ajax({
                url: 'ajax/tipos_formularios.php',
                method: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                dataType: 'json',
                success: function(response) {
                    if (response.success) {
                        $('#resultados').prepend('<div class="alert alert-success alert-dismissible">' + 
                            response.message + 
                            '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>');
                        $('#formTipoFormulario')[0].reset();
                        cargarTipos();
                    } else {
                        $('#resultados').prepend('<div class="alert alert-danger alert-dismissible">' + 
                            response.message + 
                            '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>');
                    }
                },
                error: function(xhr, status, error) {
                    $('#resultados').prepend('<div class="alert alert-danger alert-dismissible">Error de conexión: ' + 
                        error + 
                        '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>');
                }
            });
        }
        
        function eliminarTipo(id) {
            if (confirm('¿Está seguro de que desea eliminar este tipo de formulario?')) {
                $.ajax({
                    url: 'ajax/tipos_formularios.php',
                    method: 'POST',
                    data: { 
                        accion: 'eliminar',
                        id: id 
                    },
                    dataType: 'json',
                    success: function(response) {
                        if (response.success) {
                            $('#resultados').prepend('<div class="alert alert-success alert-dismissible">' + 
                                response.message + 
                                '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>');
                            cargarTipos();
                        } else {
                            $('#resultados').prepend('<div class="alert alert-danger alert-dismissible">' + 
                                response.message + 
                                '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>');
                        }
                    },
                    error: function(xhr, status, error) {
                        $('#resultados').prepend('<div class="alert alert-danger alert-dismissible">Error: ' + 
                            error + 
                            '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>');
                    }
                });
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
