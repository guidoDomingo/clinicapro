<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modal - Doctores por Fecha</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 1000px; 
            margin: 20px auto; 
            padding: 20px; 
        }
        .test-section {
            border: 1px solid #ddd;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        pre { 
            background: white; 
            padding: 15px; 
            border-radius: 5px; 
            overflow-x: auto;
            border: 1px solid #ddd;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        .step { font-weight: bold; color: #495057; }
    </style>
</head>
<body>
    <h1>🔬 Test Exacto del Modal - Doctores por Fecha</h1>
    <p>Esta página replica exactamente la funcionalidad del modal de edición.</p>
    
    <div class="test-section">
        <h3>📝 Configuración</h3>
        <label><strong>Fecha:</strong> <input type="date" id="fechaModal" value="2025-07-17"></label>
        <button onclick="simularCambioFecha()">🔄 Simular Cambio de Fecha (como en modal)</button>
        <button onclick="testDirecto()">🧪 Test Directo del Modelo</button>
        <button onclick="limpiar()">🗑️ Limpiar</button>
    </div>
    
    <div id="resultados"></div>
    
    <script>
        function log(mensaje, tipo = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const html = `
                <div class="test-section ${tipo}">
                    <div class="step">[${timestamp}] ${mensaje}</div>
                </div>
            `;
            document.getElementById('resultados').insertAdjacentHTML('beforeend', html);
        }
        
        function logData(titulo, datos, tipo = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const html = `
                <div class="test-section ${tipo}">
                    <div class="step">[${timestamp}] ${titulo}</div>
                    <pre>${typeof datos === 'object' ? JSON.stringify(datos, null, 2) : datos}</pre>
                </div>
            `;
            document.getElementById('resultados').insertAdjacentHTML('beforeend', html);
        }
        
        // Esta función replica exactamente lo que hace el modal
        function cargarDoctoresPorFecha(fecha) {
            return new Promise((resolve, reject) => {
                log('🩺 Cargando doctores para fecha: ' + fecha);
                
                if (!fecha) {
                    log('⚠️ No se proporcionó fecha', 'error');
                    resolve();
                    return;
                }
                
                $.ajax({
                    url: 'ajax/servicios.ajax.php',
                    method: 'POST',
                    data: {
                        action: 'obtenerDoctoresPorFecha',
                        fecha: fecha
                    },
                    dataType: 'json',
                    beforeSend: function() {
                        log('⏳ Enviando solicitud AJAX...');
                    },
                    success: function(respuesta) {
                        logData('📥 Respuesta AJAX recibida', respuesta);
                        
                        if (respuesta.status === 'success' && respuesta.data && respuesta.data.length > 0) {
                            log(`✅ ${respuesta.total} doctores encontrados`, 'success');
                            
                            respuesta.data.forEach((doctor, index) => {
                                log(`👨‍⚕️ Doctor ${index + 1}: ${doctor.nombre_doctor} (ID: ${doctor.doctor_id}) - ${doctor.hora_inicio} a ${doctor.hora_fin}`, 'success');
                            });
                            
                            resolve(respuesta.data);
                        } else if (respuesta.status === 'success' && (!respuesta.data || respuesta.data.length === 0)) {
                            log('⚠️ No se encontraron doctores para esta fecha', 'error');
                            resolve([]);
                        } else {
                            log('❌ Error en respuesta: ' + (respuesta.message || 'Error desconocido'), 'error');
                            reject(respuesta.message || 'Error desconocido');
                        }
                    },
                    error: function(xhr, status, error) {
                        logData('💥 Error AJAX', {
                            status: status,
                            error: error,
                            responseText: xhr.responseText,
                            statusCode: xhr.status
                        }, 'error');
                        reject('Error AJAX: ' + error);
                    }
                });
            });
        }
        
        function simularCambioFecha() {
            const fecha = document.getElementById('fechaModal').value;
            log('🔄 Simulando cambio de fecha en modal a: ' + fecha);
            
            cargarDoctoresPorFecha(fecha)
                .then(doctores => {
                    log(`✅ Simulación completada. Doctores obtenidos: ${doctores.length}`, 'success');
                })
                .catch(error => {
                    log('❌ Error en simulación: ' + error, 'error');
                });
        }
        
        function testDirecto() {
            const fecha = document.getElementById('fechaModal').value;
            log('🧪 Realizando test directo...');
            
            // Test directo via PHP
            $.ajax({
                url: 'test_ajax_debug.php',
                method: 'GET',
                success: function(response) {
                    logData('📊 Test directo completado', response);
                },
                error: function(xhr, status, error) {
                    log('💥 Error en test directo: ' + error, 'error');
                }
            });
        }
        
        function limpiar() {
            document.getElementById('resultados').innerHTML = '';
        }
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Test del modal inicializado');
            log('📅 Fecha configurada: 2025-07-17 (JUEVES)');
            log('🎯 Objetivo: Obtener Dr. ronal con sus horarios');
            log('');
            log('👆 Haga clic en "Simular Cambio de Fecha" para replicar exactamente lo que hace el modal');
        });
    </script>
</body>
</html>
