<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Directo - AJAX Envío Emails</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3>🧪 Test Directo - AJAX Envío de Emails</h3>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h5>1. Validar Consulta</h5>
                                <div class="form-group">
                                    <label>ID de Consulta:</label>
                                    <input type="number" id="idConsulta" class="form-control" value="102">
                                </div>
                                <button class="btn btn-info btn-block" onclick="validarConsulta()">
                                    Validar Consulta
                                </button>
                            </div>
                            <div class="col-md-6">
                                <h5>2. Enviar Email</h5>
                                <div class="form-group">
                                    <label>Emails (separados por coma):</label>
                                    <input type="text" id="emails" class="form-control" value="test@example.com,guido@test.com">
                                </div>
                                <button class="btn btn-success btn-block" onclick="enviarEmail()">
                                    Enviar Email
                                </button>
                            </div>
                        </div>
                        
                        <hr>
                        
                        <h5>Resultados:</h5>
                        <div id="resultados" style="background-color: #f8f9fa; padding: 15px; border-radius: 5px; min-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function log(mensaje) {
            const now = new Date().toLocaleTimeString();
            const resultados = document.getElementById('resultados');
            resultados.innerHTML += `[${now}] ${mensaje}\n`;
            resultados.scrollTop = resultados.scrollHeight;
        }

        async function validarConsulta() {
            const idConsulta = document.getElementById('idConsulta').value;
            log(`🔍 Validando consulta ID: ${idConsulta}`);
            
            try {
                const formData = new FormData();
                formData.append('operacion', 'validar_consulta_envio');
                formData.append('id_consulta', idConsulta);
                
                log('📤 Enviando petición de validación...');
                
                const response = await fetch('ajax/enviar_consulta_email.php', {
                    method: 'POST',
                    body: formData
                });
                
                log(`📨 Respuesta recibida. Status: ${response.status}`);
                
                const responseText = await response.text();
                log(`📄 Texto crudo de respuesta: ${responseText.substring(0, 500)}...`);
                
                try {
                    const resultado = JSON.parse(responseText);
                    log(`✅ JSON parseado exitosamente`);
                    log(`📊 Resultado: ${JSON.stringify(resultado, null, 2)}`);
                    
                    if (resultado.success) {
                        log(`✅ Consulta válida encontrada:`);
                        if (resultado.consulta) {
                            log(`   - ID: ${resultado.consulta.id}`);
                            log(`   - Paciente: ${resultado.consulta.paciente}`);
                            log(`   - Fecha: ${resultado.consulta.fecha}`);
                            log(`   - Tipo: ${resultado.consulta.tipo}`);
                        }
                    } else {
                        log(`❌ Error: ${resultado.message}`);
                    }
                } catch (parseError) {
                    log(`❌ Error al parsear JSON: ${parseError.message}`);
                    log(`📄 Respuesta completa: ${responseText}`);
                }
                
            } catch (error) {
                log(`❌ Error de conexión: ${error.message}`);
            }
        }

        async function enviarEmail() {
            const idConsulta = document.getElementById('idConsulta').value;
            const emails = document.getElementById('emails').value;
            
            log(`📧 Enviando email para consulta ID: ${idConsulta}`);
            log(`📧 Destinatarios: ${emails}`);
            
            try {
                const formData = new FormData();
                formData.append('operacion', 'enviar_consulta_email');
                formData.append('id_consulta', idConsulta);
                formData.append('emails', emails);
                
                log('📤 Enviando petición de envío de email...');
                
                const response = await fetch('ajax/enviar_consulta_email.php', {
                    method: 'POST',
                    body: formData
                });
                
                log(`📨 Respuesta recibida. Status: ${response.status}`);
                
                const responseText = await response.text();
                log(`📄 Texto crudo de respuesta: ${responseText.substring(0, 500)}...`);
                
                try {
                    const resultado = JSON.parse(responseText);
                    log(`✅ JSON parseado exitosamente`);
                    log(`📊 Resultado: ${JSON.stringify(resultado, null, 2)}`);
                    
                    if (resultado.success) {
                        log(`✅ Emails enviados exitosamente!`);
                        log(`   - Total enviados: ${resultado.total_enviados}`);
                        log(`   - Total fallidos: ${resultado.total_fallidos}`);
                        
                        if (resultado.detalles) {
                            if (resultado.detalles.exitosos && resultado.detalles.exitosos.length > 0) {
                                log(`   - Exitosos: ${resultado.detalles.exitosos.join(', ')}`);
                            }
                            if (resultado.detalles.fallidos && resultado.detalles.fallidos.length > 0) {
                                log(`   - Fallidos: ${JSON.stringify(resultado.detalles.fallidos)}`);
                            }
                        }
                    } else {
                        log(`❌ Error en envío: ${resultado.message}`);
                    }
                } catch (parseError) {
                    log(`❌ Error al parsear JSON: ${parseError.message}`);
                    log(`📄 Respuesta completa: ${responseText}`);
                }
                
            } catch (error) {
                log(`❌ Error de conexión: ${error.message}`);
            }
        }

        // Log inicial
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Test directo de AJAX iniciado');
            log('💡 Usa los botones para probar la funcionalidad');
        });
    </script>
</body>
</html>
