<!DOCTYPE html>
<html>
<head>
    <title>Test Archivos Corregidos</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h2>Test Archivos Corregidos - Preformatos</h2>
    
    <button onclick="testGetDoctor()">Test getDoctorByUserId (user_id: 9)</button>
    <button onclick="testGetPreformatos()">Test getPreformatos</button>
    <button onclick="testGetMotivos()">Test getMotivos</button>
    
    <div id="results"></div>
    
    <script>
    function testGetDoctor() {
        $('#results').html('<p>Probando getDoctorByUserId...</p>');
        
        $.ajax({
            url: 'ajax/preformatos.ajax.php',
            method: 'POST',
            data: {
                operacion: 'getDoctorByUserId',
                user_id: 9
            },
            success: function(response) {
                $('#results').html('<h3>✓ getDoctorByUserId Exitoso:</h3><pre>' + JSON.stringify(response, null, 2) + '</pre>');
            },
            error: function(xhr, status, error) {
                $('#results').html('<h3>✗ Error getDoctorByUserId:</h3>' +
                    '<p><strong>Status:</strong> ' + xhr.status + '</p>' +
                    '<p><strong>Error:</strong> ' + error + '</p>' +
                    '<p><strong>Response:</strong></p>' +
                    '<pre>' + xhr.responseText + '</pre>');
            }
        });
    }
    
    function testGetPreformatos() {
        $('#results').html('<p>Probando getPreformatosConsulta...</p>');
        
        $.ajax({
            url: 'ajax/preformatos.ajax.php',
            method: 'POST',
            data: {
                operacion: 'getPreformatosConsulta',
                usuario_id: 9,
                tipo_formulario: 'general'
            },
            success: function(response) {
                $('#results').html('<h3>✓ getPreformatos Exitoso:</h3><pre>' + JSON.stringify(response, null, 2) + '</pre>');
            },
            error: function(xhr, status, error) {
                $('#results').html('<h3>✗ Error getPreformatos:</h3>' +
                    '<p><strong>Status:</strong> ' + xhr.status + '</p>' +
                    '<p><strong>Error:</strong> ' + error + '</p>' +
                    '<p><strong>Response:</strong></p>' +
                    '<pre>' + xhr.responseText + '</pre>');
            }
        });
    }
    
    function testGetMotivos() {
        $('#results').html('<p>Probando getMotivosComunes...</p>');
        
        $.ajax({
            url: 'ajax/preformatos.ajax.php',
            method: 'POST',
            data: {
                operacion: 'getMotivosComunes',
                tipo_formulario: 'general'
            },
            success: function(response) {
                $('#results').html('<h3>✓ getMotivos Exitoso:</h3><pre>' + JSON.stringify(response, null, 2) + '</pre>');
            },
            error: function(xhr, status, error) {
                $('#results').html('<h3>✗ Error getMotivos:</h3>' +
                    '<p><strong>Status:</strong> ' + xhr.status + '</p>' +
                    '<p><strong>Error:</strong> ' + error + '</p>' +
                    '<p><strong>Response:</strong></p>' +
                    '<pre>' + xhr.responseText + '</pre>');
            }
        });
    }
    
    // Auto-ejecutar
    $(document).ready(function() {
        testGetDoctor();
    });
    </script>
</body>
</html>
