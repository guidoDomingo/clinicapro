<!DOCTYPE html>
<html>
<head>
    <title>Test AJAX Simple</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h2>Test AJAX Simple - Preformatos</h2>
    
    <button onclick="testBasico()">Test Básico</button>
    <button onclick="testGetDoctor()">Test Get Doctor</button>
    
    <div id="results"></div>
    
    <script>
    function testBasico() {
        $('#results').html('<p>Enviando test básico...</p>');
        
        $.ajax({
            url: 'ajax/preformatos_simple.ajax.php',
            method: 'POST',
            data: {
                operacion: 'test'
            },
            success: function(response) {
                $('#results').html('<h3>Éxito:</h3><pre>' + JSON.stringify(response, null, 2) + '</pre>');
            },
            error: function(xhr, status, error) {
                $('#results').html('<h3>Error:</h3>' +
                    '<p><strong>Status:</strong> ' + xhr.status + '</p>' +
                    '<p><strong>Error:</strong> ' + error + '</p>' +
                    '<p><strong>Response:</strong></p>' +
                    '<pre>' + xhr.responseText + '</pre>');
            }
        });
    }
    
    function testGetDoctor() {
        $('#results').html('<p>Enviando test getDoctorByUserId...</p>');
        
        $.ajax({
            url: 'ajax/preformatos_simple.ajax.php',
            method: 'POST',
            data: {
                operacion: 'getDoctorByUserId',
                user_id: 1
            },
            success: function(response) {
                $('#results').html('<h3>Éxito:</h3><pre>' + JSON.stringify(response, null, 2) + '</pre>');
            },
            error: function(xhr, status, error) {
                $('#results').html('<h3>Error:</h3>' +
                    '<p><strong>Status:</strong> ' + xhr.status + '</p>' +
                    '<p><strong>Error:</strong> ' + error + '</p>' +
                    '<p><strong>Response:</strong></p>' +
                    '<pre>' + xhr.responseText + '</pre>');
            }
        });
    }
    </script>
</body>
</html>
