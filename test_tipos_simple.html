<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Tipos Formularios AJAX</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h2>Test Directo - Tipos de Formularios</h2>
    
    <div>
        <label for="tipo-formulario">Tipo de Formulario:</label>
        <select id="tipo-formulario">
            <option value="">Cargando...</option>
        </select>
    </div>
    
    <div id="debug-output" style="margin-top: 20px; padding: 10px; background: #f0f0f0;">
        <h3>Debug Output:</h3>
        <pre id="debug-content"></pre>
    </div>

    <script>
        function cargarTiposFormularios() {
            console.log('Iniciando carga de tipos de formularios...');
            
            const selectTipoFormulario = document.getElementById('tipo-formulario');
            const debugContent = document.getElementById('debug-content');
            
            // Crear FormData para la petición
            const formData = new FormData();
            formData.append('operacion', 'getTiposFormularios');
            
            // Hacer la petición AJAX
            $.ajax({
                type: 'POST',
                url: 'ajax/preformatos.ajax.php',
                data: formData,
                dataType: "json",
                processData: false,
                contentType: false,
                success: function(response) {
                    console.log('Respuesta tipos formularios:', response);
                    debugContent.textContent = JSON.stringify(response, null, 2);
                    
                    if (response.status === 'success' && response.data) {
                        // Limpiar selector manteniendo la opción default
                        selectTipoFormulario.innerHTML = '<option value="">Seleccione un tipo de formulario</option>';
                        
                        // Agregar opciones de tipos de formularios
                        response.data.forEach(function(tipo) {
                            const option = document.createElement('option');
                            option.value = tipo.id;
                            option.textContent = tipo.nombre;
                            if (tipo.descripcion) {
                                option.title = tipo.descripcion;
                            }
                            selectTipoFormulario.appendChild(option);
                        });
                        
                        console.log(`Se cargaron ${response.data.length} tipos de formularios`);
                    } else {
                        console.error('Error al cargar tipos de formularios:', response.message);
                        selectTipoFormulario.innerHTML = '<option value="">Error al cargar tipos</option>';
                    }
                },
                error: function(xhr, status, error) {
                    console.error("Error al cargar tipos de formularios:", error);
                    debugContent.textContent = `Error: ${error}\nStatus: ${status}\nResponse: ${xhr.responseText}`;
                    selectTipoFormulario.innerHTML = '<option value="">Error al cargar tipos</option>';
                }
            });
        }
        
        // Ejecutar al cargar la página
        $(document).ready(function() {
            cargarTiposFormularios();
        });
    </script>
</body>
</html>
